name: Patch Paint dialog closure flow

on:
  push:
    branches: [v1.0.143-rc4-paint-dialog-closure]
    paths:
      - '.github/workflows/patch-rc4-paint-dialog-closure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.143-rc4-paint-dialog-closure
          fetch-depth: 0
      - name: Patch flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('DrawBot.py')
          text=path.read_text(encoding='utf-8')
          old="""                meta=probe_handle_isolated(int(candidate['handle']))\n                exact_controls=prepare_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                rect=tuple(meta['client_rect'])\n"""
          new="""                meta=probe_handle_isolated(int(candidate['handle']))\n                exact_controls=prepare_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                # Edit colors is a modal Paint window. prepare_controls() now\n                # proves that it has disappeared, but explicitly return focus to\n                # the Paint document before taking any canvas/ribbon screenshot.\n                # This prevents our own RGB calibration dialog from being treated\n                # as an overlay covering the selected drawing area.\n                if not WindowMonitor().activate(target):\n                    raise ValueError('Paint Edit colors closed, but Paint could not be reactivated. Bring Paint into view and retry.')\n                if self.stop.wait(.15):raise InterruptedError()\n                meta=probe_handle_isolated(int(candidate['handle']))\n                rect=tuple(meta['client_rect'])\n"""
          if old not in text:raise SystemExit('DrawBot Paint preparation anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          path=Path('PictureCustomPalette.py')
          text=path.read_text(encoding='utf-8')
          old="""        def progress(index, total, rgb):\n            if not monitor.activate(target):\n                raise InterruptedError(\"Paint lost focus while building the picture custom palette.\")\n            app.events.put((\"status\", f\"Custom color palette for picture: RGB {rgb} · {index}/{total}\"))\n\n        completed = apply_custom_rgb_sequence(\n            mouse, keyboard_backend, controls, custom,\n            cancelled=app.stop.is_set, wait=app.stop.wait, progress=progress,\n        )\n        app.picture_custom_palette_state = dict(\n"""
          new="""        def progress(index, total, rgb):\n            # OK normally returns foreground ownership to Paint immediately, but\n            # current XAML Paint can leave Edit colors visible for another UI\n            # cycle. Give it a short cheap foreground grace period; only if the\n            # modal persists do we use the calibrated/UIA OK fallback.\n            active=False\n            for _ in range(8):\n                try:\n                    if monitor.active(target):active=True;break\n                except (OSError,ValueError,InterruptedError):\n                    pass\n                if app.stop.wait(.04):raise InterruptedError(\"Picture custom palette cancelled.\")\n            if not active:\n                from PaintPreparation import close_edit_colors\n                close_edit_colors(handle,accept=True,cancelled=app.stop.is_set,wait=app.stop.wait)\n                if not monitor.activate(target):\n                    raise InterruptedError(\"Paint Edit colors did not return focus to the Paint document.\")\n                if app.stop.wait(.12):raise InterruptedError(\"Picture custom palette cancelled.\")\n            app.events.put((\"status\", f\"Custom color palette for picture: RGB {rgb} · {index}/{total}\"))\n\n        completed = apply_custom_rgb_sequence(\n            mouse, keyboard_backend, controls, custom,\n            cancelled=app.stop.is_set, wait=app.stop.wait, progress=progress,\n        )\n        # Hard postcondition for the preparation action: never leave Edit colors\n        # over the document when control returns to Draw Studio.\n        from PaintPreparation import close_edit_colors\n        close_edit_colors(handle,accept=True,cancelled=app.stop.is_set,wait=app.stop.wait)\n        if not monitor.activate(target):\n            raise InterruptedError(\"Paint could not be reactivated after picture custom palette preparation.\")\n        if app.stop.wait(.12):raise InterruptedError(\"Picture custom palette cancelled.\")\n        app.picture_custom_palette_state = dict(\n"""
          if old not in text:raise SystemExit('PictureCustomPalette progress anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DrawBot.py PictureCustomPalette.py
          git diff --cached --check
          git commit -m 'Require Edit colors closure before canvas work'
          git push origin HEAD:v1.0.143-rc4-paint-dialog-closure
