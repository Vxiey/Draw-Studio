name: Build and publish Draw Studio Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/step30-build-trigger'

permissions:
  contents: write

concurrency:
  group: draw-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install source dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source package hygiene gate
        shell: pwsh
        run: |
          python ReleasePackage.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release source gate
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regressions and self-test
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build verified Windows release
        shell: pwsh
        run: |
          python build_release.py --installer --skip-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate packaged release
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --release-dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate silent installer round-trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release/DrawStudio-*-Windows-x64-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not produced' }

          $installDir = Join-Path $env:RUNNER_TEMP 'DrawStudio-release-install'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          Write-Host "Installing $($setup.Name) to $installDir"
          $installProcess = Start-Process -FilePath $setup.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") `
            -Wait -PassThru
          Write-Host "Installer exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) { throw "Silent install failed: $($installProcess.ExitCode)" }

          $exe = Join-Path $installDir 'DrawStudio.exe'
          if (-not (Test-Path $exe)) { throw "Installed DrawStudio.exe is missing at $exe" }
          Write-Host 'Running installed DrawStudio.exe --self-test'
          $selfTestProcess = Start-Process -FilePath $exe -ArgumentList @('--self-test') -Wait -PassThru
          Write-Host "Installed self-test exit code: $($selfTestProcess.ExitCode)"
          if ($selfTestProcess.ExitCode -ne 0) { throw "Installed self-test failed: $($selfTestProcess.ExitCode)" }

          $uninstall = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw "Uninstaller is missing at $uninstall" }
          Write-Host 'Running silent uninstall'
          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          Write-Host "Uninstaller exit code: $($uninstallProcess.ExitCode)"
          if ($uninstallProcess.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstallProcess.ExitCode)" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DrawStudio-${{ github.ref_name }}-Windows-x64
          path: |
            release/DrawStudio-*-Windows-x64.zip
            release/DrawStudio-*-Windows-x64-Setup.exe
            release/DrawStudio-*-SHA256.txt
            release/DrawStudio-*-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            release/DrawStudio-*-Windows-x64.zip `
            release/DrawStudio-*-Windows-x64-Setup.exe `
            release/DrawStudio-*-SHA256.txt `
            release/DrawStudio-*-manifest.json `
            --prerelease `
            --title "Draw Studio $env:GITHUB_REF_NAME" `
            --notes-file RELEASE-NOTES-v1.0.133-rc1.md

  remove-merged-adaptive-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the requested branch only after verifying its history is in main
        shell: bash
        run: |
          set -euo pipefail
          branch_ref='refs/heads/adaptive-hybrid-132'
          expected_sha='0fa46061d1d6aff8f853b03cc7245243ac7da318'
          actual_sha=$(git ls-remote --heads origin "$branch_ref" | cut -f1)
          if [ -z "$actual_sha" ]; then
            echo 'Adaptive branch is already removed.'
            exit 0
          fi
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo 'Adaptive branch changed; refusing deletion.'
            exit 1
          fi
          git merge-base --is-ancestor "$expected_sha" HEAD
          git push --force-with-lease="$branch_ref:$expected_sha" origin ":$branch_ref"
