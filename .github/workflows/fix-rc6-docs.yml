name: Fix Image Draw Bot rc6 docs

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-rc6-docs-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update current release documentation
        run: python .github/fix_rc6_docs.py
      - name: Verify documentation references
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('README.md','VERSION-HISTORY.md'):
              text=Path(name).read_text(encoding='utf-8')
              assert '1.0.145-rc6' in text, name
          PY
      - name: Commit rc6 documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix_rc6_docs.py .github/fix-rc6-docs-trigger .github/workflows/fix-rc6-docs.yml
          git add README.md VERSION-HISTORY.md
          git commit -m "Update rc6 release documentation"
          git push origin main
