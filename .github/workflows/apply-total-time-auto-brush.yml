name: Apply rc14 total draw timer and automatic pixel brush

on:
  push:
    paths:
      - '.github/total-time-auto-brush-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply rc14 patch
        run: |
          sed -i 's/minimum=2)/minimum=1)/' .github/patch-total-time-auto-brush.py
          sed -i "s/if progress_count<2:/if progress_count<1:/" .github/patch-total-time-auto-brush.py
          python .github/patch-total-time-auto-brush.py
      - name: Compile changed Python modules
        run: python -m py_compile AutoBrushWidth.py DrawBot.py StudioUI.py PaintPreparation.py DrawTimeCalibration.py test_auto_brush_total_time_v10144.py
      - name: Run focused regressions
        run: python -m pytest -q test_auto_brush_total_time_v10144.py test_paint_preparation.py test_draw_time_estimate_v10110.py test_step9_profile_calibration_isolation_v10133.py
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Vxiey"
          git config user.email "84341307+Vxiey@users.noreply.github.com"
          git add -A
          git reset -- .github/patch-total-time-auto-brush.py .github/workflows/apply-total-time-auto-brush.yml .github/total-time-auto-brush-trigger
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "Image Draw Bot 1.0.144-rc14 total draw timer and automatic pixel brush"
          git push origin HEAD:main
