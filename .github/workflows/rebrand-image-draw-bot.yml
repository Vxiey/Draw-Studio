name: Apply Image Draw Bot rebrand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-image-draw-bot.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply full public rebrand
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          APP_NAME = 'Image Draw Bot'
          TAGLINE = 'Automatic Image Drawing'
          APP_VERSION = '1.0.144-rc1'
          FILE_VERSION = '1.0.144'
          CANONICAL_REPO = 'Vxiey/Image-Draw-Bot'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_file(path, replacements):
              p = Path(path)
              if not p.is_file():
                  return
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')

          # Public brand/repository replacement across source, tooling and docs.
          text_suffixes = {'.py', '.md', '.txt', '.bat', '.yml', '.yaml', '.iss', '.manifest', '.json'}
          for p in ROOT.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_suffixes:
                  continue
              if any(part in {'.git', '.build-venv', 'build', 'dist', 'release', '__pycache__'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = (text
                  .replace('Vxiey/Draw-Studio', CANONICAL_REPO)
                  .replace('Draw Studio', APP_NAME)
                  .replace('Draw-Studio', 'Image-Draw-Bot')
                  .replace('DrawStudio.exe', 'ImageDrawBot.exe')
                  .replace('DrawStudio.manifest', 'ImageDrawBot.manifest')
                  .replace('DrawStudio.iss', 'ImageDrawBot.iss')
                  .replace('DrawStudio-', 'ImageDrawBot-')
                  .replace('DrawStudio/', 'ImageDrawBot/')
                  .replace('draw-studio-ci-', 'image-draw-bot-ci-')
                  .replace('draw-studio-release-', 'image-draw-bot-release-'))
              if updated != text:
                  p.write_text(updated, encoding='utf-8')

          # Version source of truth + public tagline.
          write('Version.py',
                "APP_NAME = 'Image Draw Bot'\n"
                "APP_TAGLINE = 'Automatic Image Drawing'\n"
                "APP_VERSION = '1.0.144-rc1'\n"
                "FILE_VERSION = '1.0.144'\n"
                "BUILD_CHANNEL = 'rc'\n"
                "LEGACY_APP_NAME = 'Draw Studio'\n"
                "EXECUTABLE_NAME = 'ImageDrawBot.exe'\n"
                "LEGACY_EXECUTABLE_NAME = 'DrawStudio.exe'\n")

          # Rename and rebrand Windows manifest.
          old_manifest = Path('DrawStudio.manifest')
          new_manifest = Path('ImageDrawBot.manifest')
          if old_manifest.exists():
              manifest = old_manifest.read_text(encoding='utf-8')
          elif new_manifest.exists():
              manifest = new_manifest.read_text(encoding='utf-8')
          else:
              raise SystemExit('Windows manifest is missing')
          manifest = (manifest
                      .replace('name="DrawStudio"', 'name="ImageDrawBot"')
                      .replace('<description>Draw Studio</description>', '<description>Image Draw Bot - Automatic Image Drawing</description>')
                      .replace('<description>Image Draw Bot</description>', '<description>Image Draw Bot - Automatic Image Drawing</description>'))
          new_manifest.write_text(manifest, encoding='utf-8')
          if old_manifest.exists(): old_manifest.unlink()

          # Windows version resource.
          vi = read('version_info.txt')
          vi = re.sub(r'filevers=\([^\)]*\)', 'filevers=(1,0,144,0)', vi)
          vi = re.sub(r'prodvers=\([^\)]*\)', 'prodvers=(1,0,144,0)', vi)
          vi = re.sub(r"StringStruct\('CompanyName',\s*'[^']*'\)", "StringStruct('CompanyName', 'Image Draw Bot')", vi)
          vi = re.sub(r"StringStruct\('FileDescription',\s*'[^']*'\)", "StringStruct('FileDescription', 'Image Draw Bot - Automatic Image Drawing')", vi)
          vi = re.sub(r"StringStruct\('FileVersion',\s*'[^']*'\)", "StringStruct('FileVersion', '1.0.144')", vi)
          vi = re.sub(r"StringStruct\('InternalName',\s*'[^']*'\)", "StringStruct('InternalName', 'ImageDrawBot')", vi)
          vi = re.sub(r"StringStruct\('OriginalFilename',\s*'[^']*'\)", "StringStruct('OriginalFilename', 'ImageDrawBot.exe')", vi)
          vi = re.sub(r"StringStruct\('ProductName',\s*'[^']*'\)", "StringStruct('ProductName', 'Image Draw Bot')", vi)
          vi = re.sub(r"StringStruct\('ProductVersion',\s*'[^']*'\)", "StringStruct('ProductVersion', '1.0.144')", vi)
          write('version_info.txt', vi)

          # Rename/rebrand the installer but preserve the AppId so upgrades stay in-place.
          old_iss = Path('installer/DrawStudio.iss')
          new_iss = Path('installer/ImageDrawBot.iss')
          if old_iss.exists():
              iss = old_iss.read_text(encoding='utf-8')
          elif new_iss.exists():
              iss = new_iss.read_text(encoding='utf-8')
          else:
              raise SystemExit('Inno Setup source is missing')
          iss = (iss
                 .replace('#define MyAppVersion "1.0.143-rc4"', '#define MyAppVersion "1.0.144-rc1"')
                 .replace('VersionInfoVersion=1.0.143.0', 'VersionInfoVersion=1.0.144.0')
                 .replace('Source: "..\\dist\\DrawStudio\\*"', 'Source: "..\\dist\\ImageDrawBot\\*"')
                 .replace('ShouldLaunchDrawStudio', 'ShouldLaunchImageDrawBot')
                 .replace('SignTool=drawstudio', 'SignTool=imagedrawbot'))
          if '/RELAUNCHIMAGEDRAWBOT' not in iss:
              iss = iss.replace(
                  "  Result := (not WizardSilent) or HasCommandLineParam('/RELAUNCHDRAWSTUDIO');",
                  "  Result := (not WizardSilent) or HasCommandLineParam('/RELAUNCHIMAGEDRAWBOT') or HasCommandLineParam('/RELAUNCHDRAWSTUDIO');")
          if '[InstallDelete]' not in iss:
              marker='[Files]\n'
              legacy=("[InstallDelete]\n"
                      "Type: files; Name: \"{app}\\DrawStudio.exe\"\n"
                      "Type: files; Name: \"{autodesktop}\\Draw Studio.lnk\"\n"
                      "Type: files; Name: \"{group}\\Draw Studio.lnk\"\n\n")
              iss=iss.replace(marker, legacy+marker)
          new_iss.write_text(iss, encoding='utf-8')
          if old_iss.exists(): old_iss.unlink()

          # Build executable/output under the new product identity.
          be = read('build_exe.py')
          be = be.replace("'--name', 'DrawStudio'", "'--name', 'ImageDrawBot'")
          be = be.replace("'DrawStudio/", "'ImageDrawBot/")
          be = be.replace('"DrawStudio/', '"ImageDrawBot/')
          be = be.replace("base / 'dist' / ('ImageDrawBot.exe' if onefile else 'DrawStudio/ImageDrawBot.exe')",
                          "base / 'dist' / ('ImageDrawBot.exe' if onefile else 'ImageDrawBot/ImageDrawBot.exe')")
          write('build_exe.py', be)

          # Release packaging: new names, plus one legacy Setup filename as an updater bridge.
          br = read('build_release.py')
          br = br.replace('DIST = BASE / "dist" / "DrawStudio"', 'DIST = BASE / "dist" / "ImageDrawBot"')
          br = br.replace('relative = Path("DrawStudio") / path.relative_to(DIST)', 'relative = Path("ImageDrawBot") / path.relative_to(DIST)')
          br = br.replace('for path in RELEASE.glob(f"ImageDrawBot-{APP_VERSION}-*"):',
                          'for pattern in (f"ImageDrawBot-{APP_VERSION}-*", f"DrawStudio-{APP_VERSION}-*"):\n        for path in RELEASE.glob(pattern):')
          br = br.replace('            path.unlink()\n\n\ndef _write_manifest', '            path.unlink()\n\n\ndef _write_manifest', 1)
          # Repair indentation if the clean-loop replacement was applied.
          br = br.replace('        for path in RELEASE.glob(pattern):\n        if path.is_file():\n            path.unlink()',
                          '        for path in RELEASE.glob(pattern):\n            if path.is_file():\n                path.unlink()')
          br = br.replace('str(BASE / "installer" / "ImageDrawBot.iss")', 'str(BASE / "installer" / "ImageDrawBot.iss")')
          legacy_block = """        legacy_setup = RELEASE / f\"DrawStudio-{APP_VERSION}-Windows-x64-Setup.exe\"\n        shutil.copy2(setup, legacy_setup)\n        legacy_digest=sha256(legacy_setup)\n        hash_rows.append(f\"{legacy_digest}  {legacy_setup.name}\")\n        artifacts.append({\"name\":legacy_setup.name,\"type\":\"legacy-updater-bridge\",\"sha256\":legacy_digest,\"bytes\":legacy_setup.stat().st_size})\n"""
          needle='        artifacts.append({"name":setup.name,"type":"inno-setup","sha256":digest,"bytes":setup.stat().st_size})\n'
          if 'legacy-updater-bridge' not in br:
              br=br.replace(needle, needle+legacy_block)
          write('build_release.py', br)

          # Canonical update endpoint and dual-name bridge for users upgrading from Draw Studio.
          uc = read('UpdateCenter.py')
          uc = uc.replace('User-Agent": f"DrawStudio/{APP_VERSION}"', 'User-Agent": f"ImageDrawBot/{APP_VERSION}"')
          uc = uc.replace("headers={'User-Agent':f'DrawStudio/{APP_VERSION}'}", "headers={'User-Agent':f'ImageDrawBot/{APP_VERSION}'}")
          asset_function = '''def installer_asset(release):\n    """Return one verified installer asset, preferring the Image Draw Bot name.\n\n    The legacy DrawStudio filename is accepted only as an upgrade bridge for\n    installs created before the v1.0.144 rebrand.\n    """\n    from urllib.parse import urlparse,unquote\n    version=normalize_tag(release.get('tag_name'))\n    if parse_version(version) is None:return None\n    names=(f'ImageDrawBot-{version}-Windows-x64-Setup.exe',\n           f'DrawStudio-{version}-Windows-x64-Setup.exe')\n    repositories=('Vxiey/Image-Draw-Bot','Vxiey/Draw-Studio')\n    hits=[]\n    for rank,name in enumerate(names):\n        for asset in release.get('assets') or ():\n            if not isinstance(asset,dict) or asset.get('name')!=name:continue\n            url=str(asset.get('browser_download_url') or '')\n            parsed=urlparse(url)\n            valid_paths={f'/{repo}/releases/download/{release["tag_name"]}/{name}' for repo in repositories}\n            if parsed.scheme!='https' or parsed.netloc!='github.com' or unquote(parsed.path) not in valid_paths or parsed.query or parsed.fragment:continue\n            digest=str(asset.get('digest') or '')\n            if not re.fullmatch(r'sha256:[0-9a-fA-F]{64}',digest):continue\n            size=asset.get('size')\n            if type(size) is not int or not 0<size<=2*1024**3:continue\n            hits.append((rank,dict(name=name,url=url,sha256=digest[7:].lower(),size=size,version=version)))\n    if not hits:return None\n    hits.sort(key=lambda item:item[0])\n    best_rank=hits[0][0]\n    best=[item for rank,item in hits if rank==best_rank]\n    return best[0] if len(best)==1 else None\n\n\n'''
          uc = re.sub(r'def installer_asset\(release\):.*?\n\ndef download_installer', asset_function+'def download_installer', uc, flags=re.S)
          uc = uc.replace("installed=(current.name.lower()=='imagedrawbot.exe' and any(current.parent.glob('unins*.exe')))",
                          "installed=(current.name.lower() in ('imagedrawbot.exe','drawstudio.exe') and any(current.parent.glob('unins*.exe')))")
          uc = uc.replace("'/RELAUNCHDRAWSTUDIO',", "'/RELAUNCHIMAGEDRAWBOT',")
          write('UpdateCenter.py', uc)

          # Move frozen per-user storage to the new brand once, retaining the legacy copy on failure.
          rp = read('RuntimePaths.py')
          if 'import shutil' not in rp:
              rp=rp.replace('import os\n', 'import os\nimport shutil\n')
          new_data = '''def data_dir() -> Path:\n    """Return the writable Image Draw Bot data directory.\n\n    Frozen v1.0.144+ builds migrate the former DrawBotStudio directory by\n    copying it once. If migration is blocked, the legacy directory remains the\n    safe fallback so settings/calibration are never lost.\n    """\n    if is_frozen():\n        base = Path((os.environ.get("LOCALAPPDATA") or str(Path.home())))\n        root = base / "ImageDrawBot"\n        legacy = base / "DrawBotStudio"\n        if not root.exists() and legacy.exists():\n            try:\n                shutil.copytree(legacy, root)\n            except OSError:\n                root = legacy\n    else:\n        root = source_dir()\n    root.mkdir(parents=True, exist_ok=True)\n    return root\n\n\n'''
          rp=re.sub(r'def data_dir\(\) -> Path:.*?\n\ndef atomic_write_text', new_data+'def atomic_write_text', rp, flags=re.S)
          write('RuntimePaths.py', rp)

          # Crash-dump configuration uses the new executable while still accepting old backup entries.
          cd = read('CrashDumpConfig.py')
          cd = cd.replace("/'DrawBotStudio'/'dumps'", "/'ImageDrawBot'/'dumps'")
          cd = cd.replace("if name not in ('ImageDrawBot.exe','python.exe','pythonw.exe'):",
                          "if name not in ('ImageDrawBot.exe','DrawStudio.exe','python.exe','pythonw.exe'):")
          write('CrashDumpConfig.py', cd)

          # New signing variable names with legacy environment fallback.
          cs = read('CodeSigning.py')
          cs = cs.replace("thumb=str(env.get('DRAWSTUDIO_SIGNING_THUMBPRINT','')).replace(' ','')",
                          "thumb=str(env.get('IMAGEDRAWBOT_SIGNING_THUMBPRINT') or env.get('DRAWSTUDIO_SIGNING_THUMBPRINT','')).replace(' ','')")
          cs = cs.replace("Set DRAWSTUDIO_SIGNING_THUMBPRINT", "Set IMAGEDRAWBOT_SIGNING_THUMBPRINT (or legacy DRAWSTUDIO_SIGNING_THUMBPRINT)")
          cs = cs.replace("tool=env.get('DRAWSTUDIO_SIGNTOOL') or shutil.which('signtool.exe')",
                          "tool=env.get('IMAGEDRAWBOT_SIGNTOOL') or env.get('DRAWSTUDIO_SIGNTOOL') or shutil.which('signtool.exe')")
          cs = cs.replace("Set DRAWSTUDIO_SIGNTOOL to Windows SDK signtool.exe.", "Set IMAGEDRAWBOT_SIGNTOOL to Windows SDK signtool.exe.")
          cs = cs.replace("return ['/DSignRelease','/Sdrawstudio='+command]", "return ['/DSignRelease','/Simagedrawbot='+command]")
          write('CodeSigning.py', cs)

          # Release hardening/packaging must assert the new public identity.
          rch = read('ReleaseCandidateHardening.py')
          rch = rch.replace('EXPECTED_REPOSITORY = "Vxiey/Image-Draw-Bot"', 'EXPECTED_REPOSITORY = "Vxiey/Image-Draw-Bot"')
          rch = rch.replace('root / "installer" / "ImageDrawBot.iss"', 'root / "installer" / "ImageDrawBot.iss"')
          write('ReleaseCandidateHardening.py', rch)

          rpk = read('ReleasePackage.py')
          rpk = rpk.replace('ROOT_PREFIX = "Image-Draw-Bot"', 'ROOT_PREFIX = "Image-Draw-Bot"')
          # Keep old generated/log prefixes excluded during the migration window.
          if '"DrawStudio-Safety-"' not in rpk:
              rpk=rpk.replace('EXCLUDED_PREFIXES = (\n', 'EXCLUDED_PREFIXES = (\n    "DrawStudio-Safety-",\n    "DrawStudio-crash",\n    "DrawStudio-session",\n    "DrawStudio-target-probe",\n    "DrawStudio-mouse-probe",\n')
          rpk=rpk.replace('name.startswith(("Image-Draw-Bot-", "ImageDrawBot-"))',
                          'name.startswith(("Image-Draw-Bot-", "ImageDrawBot-", "Draw-Studio-", "DrawStudio-"))')
          write('ReleasePackage.py', rpk)

          # Current release workflow and CI naming.
          bw = read('.github/workflows/build-windows.yml')
          bw = bw.replace('Draw Studio Windows release', 'Image Draw Bot Windows release')
          bw = bw.replace('DrawStudio-release-install', 'ImageDrawBot-release-install')
          bw = bw.replace('"Draw Studio $tag"', '"Image Draw Bot $tag"')
          # Upload both the new artifacts and the one legacy Setup bridge.
          if 'release/DrawStudio-*-Windows-x64-Setup.exe' not in bw:
              bw=bw.replace('release/ImageDrawBot-*-Windows-x64-Setup.exe\n',
                            'release/ImageDrawBot-*-Windows-x64-Setup.exe\n            release/DrawStudio-*-Windows-x64-Setup.exe\n')
              bw=bw.replace('release/ImageDrawBot-*-Windows-x64-Setup.exe release/ImageDrawBot-*-SHA256.txt',
                            'release/ImageDrawBot-*-Windows-x64-Setup.exe release/DrawStudio-*-Windows-x64-Setup.exe release/ImageDrawBot-*-SHA256.txt')
          write('.github/workflows/build-windows.yml', bw)

          ci = read('.github/workflows/ci.yml')
          ci = ci.replace('name: Image Draw Bot CI', 'name: Image Draw Bot CI')
          write('.github/workflows/ci.yml', ci)

          # README gets a direct SEO-oriented product title/tagline and current release links.
          readme = read('README.md')
          readme = re.sub(r'^# .*$', '# Image Draw Bot — Automatic Image Drawing', readme, count=1, flags=re.M)
          readme = re.sub(r'^\*\*Turn images into drawings.*?\*\*$',
                          '**Automatically recreate images in Microsoft Paint, Gartic Phone, Skribbl.io and other drawing apps.**',
                          readme, count=1, flags=re.M)
          readme = readme.replace('v1.0.143-rc4', 'v1.0.144-rc1').replace('1.0.143-rc4', '1.0.144-rc1')
          if 'Formerly Draw Studio' not in readme:
              readme = readme.replace('\n## Download', '\n> Formerly **Draw Studio**. Existing local settings and calibrations are migrated automatically.\n\n## Download', 1)
          write('README.md', readme)

          for doc in ('README-INDEX.md','docs/README.md','docs/IN-APP-UPDATES.md','docs/PUBLISHING.md','docs/RELEASE-NAMING.md','docs/RELEASE-STRUCTURE.md','RELEASE-CHECKLIST.md','GITHUB-RELEASE-TEMPLATE.md','Build-Release.bat','Start.bat'):
              p=Path(doc)
              if p.exists():
                  t=p.read_text(encoding='utf-8')
                  if doc in ('README-INDEX.md','docs/README.md','docs/IN-APP-UPDATES.md'):
                      t=t.replace('v1.0.143-rc4','v1.0.144-rc1').replace('1.0.143-rc4','1.0.144-rc1')
                  p.write_text(t,encoding='utf-8')

          # Add the rebrand to both version histories without rewriting version numbers in old entries.
          history_entry = '''# v1.0.144-rc1\n\n- Full public rebrand from **Draw Studio** to **Image Draw Bot — Automatic Image Drawing**.\n- GitHub repository, UI titles, Windows metadata, installer, EXE and release artifacts now use the Image Draw Bot identity.\n- New frozen installs use `%LOCALAPPDATA%\\ImageDrawBot`; existing `DrawBotStudio` data is copied forward automatically with a safe legacy fallback.\n- The installer keeps the existing AppId for in-place upgrades and removes stale Draw Studio shortcuts/EXE files.\n- The updater accepts both ImageDrawBot and legacy DrawStudio installer/executable names during the transition.\n- Sketch/single-color Paint modes continue to bypass Edit colors.\n\n'''
          for path in ('VERSION-HISTORY.md','docs/VERSION-HISTORY.md'):
              p=Path(path)
              if p.exists():
                  t=p.read_text(encoding='utf-8')
                  if not t.startswith('# v1.0.144-rc1'):
                      p.write_text(history_entry+t,encoding='utf-8')

          release_notes = '''# Image Draw Bot v1.0.144-rc1 — Automatic Image Drawing\n\nThis release completes the public rebrand from **Draw Studio** to **Image Draw Bot** while preserving upgrade compatibility.\n\n## Rebrand\n\n- Product name: **Image Draw Bot**\n- Tagline: **Automatic Image Drawing**\n- Repository: `Vxiey/Image-Draw-Bot`\n- Windows executable: `ImageDrawBot.exe`\n- Installer/ZIP/checksum/manifest artifacts use the `ImageDrawBot-` prefix.\n- UI, calibration windows, launcher text, Windows file metadata and release titles use the new brand.\n\n## Compatibility\n\n- The Inno Setup AppId is unchanged, so an installed Draw Studio copy upgrades in place.\n- Existing `%LOCALAPPDATA%\\DrawBotStudio` settings/calibrations are copied to `%LOCALAPPDATA%\\ImageDrawBot` on first frozen run; the old directory remains untouched as a fallback.\n- The new updater accepts both `ImageDrawBot.exe` and legacy `DrawStudio.exe` installs.\n- The release includes a legacy-named Setup alias for older updater clients during the transition.\n\n## Paint behavior\n\nThe current Paint safety fixes remain intact, including the rule that sketch/single-color modes do not open Edit colors.\n'''
          write('RELEASE-NOTES-v1.0.144-rc1.md', release_notes)

          # Update only explicit current-version assertions in regression tests.
          for p in ROOT.glob('test_*.py'):
              t=p.read_text(encoding='utf-8')
              t=re.sub(r"(assertEqual\(APP_VERSION\s*,\s*['\"])1\.0\.143-rc4(['\"]\))", r"\g<1>1.0.144-rc1\2", t)
              t=re.sub(r"(assertEqual\(FILE_VERSION\s*,\s*['\"])1\.0\.143(['\"]\))", r"\g<1>1.0.144\2", t)
              p.write_text(t,encoding='utf-8')

          # Release-gate tests that read renamed files/artifacts need the new identity.
          for p in ROOT.glob('test_*.py'):
              t=p.read_text(encoding='utf-8')
              t=(t.replace('DrawStudio.manifest','ImageDrawBot.manifest')
                   .replace('DrawStudio.exe','ImageDrawBot.exe')
                   .replace('DrawStudio-','ImageDrawBot-')
                   .replace('Vxiey/Draw-Studio','Vxiey/Image-Draw-Bot')
                   .replace('Draw Studio','Image Draw Bot'))
              p.write_text(t,encoding='utf-8')

          rebrand_test = '''import unittest\nfrom pathlib import Path\n\nfrom Version import APP_NAME, APP_TAGLINE, APP_VERSION, FILE_VERSION\nimport UpdateCenter\n\nROOT=Path(__file__).resolve().parent\n\nclass RebrandV10144Tests(unittest.TestCase):\n    def test_public_identity(self):\n        self.assertEqual(APP_NAME,'Image Draw Bot')\n        self.assertEqual(APP_TAGLINE,'Automatic Image Drawing')\n        self.assertEqual(APP_VERSION,'1.0.144-rc1')\n        self.assertEqual(FILE_VERSION,'1.0.144')\n        self.assertEqual(UpdateCenter.GITHUB_REPOSITORY,'Vxiey/Image-Draw-Bot')\n\n    def test_windows_identity(self):\n        installer=(ROOT/'installer'/'ImageDrawBot.iss').read_text(encoding='utf-8')\n        self.assertIn('AppId={{6A4AD303-4F16-4ED7-A9AF-5B912352D83E}',installer)\n        self.assertIn('AppName=Image Draw Bot',installer)\n        self.assertIn('ImageDrawBot.exe',installer)\n        self.assertIn('/RELAUNCHIMAGEDRAWBOT',installer)\n        self.assertIn('/RELAUNCHDRAWSTUDIO',installer)\n        self.assertFalse((ROOT/'installer'/'DrawStudio.iss').exists())\n        self.assertTrue((ROOT/'ImageDrawBot.manifest').exists())\n        self.assertFalse((ROOT/'DrawStudio.manifest').exists())\n\n    def test_build_and_release_names(self):\n        build=(ROOT/'build_exe.py').read_text(encoding='utf-8')\n        release=(ROOT/'build_release.py').read_text(encoding='utf-8')\n        workflow=(ROOT/'.github'/'workflows'/'build-windows.yml').read_text(encoding='utf-8')\n        self.assertIn("'--name', 'ImageDrawBot'",build)\n        self.assertIn('dist" / "ImageDrawBot',release)\n        self.assertIn('ImageDrawBot-${{ github.ref_name }}-Windows-x64',workflow)\n\n    def test_legacy_updater_bridge(self):\n        from UpdateCenter import installer_launch_args\n        args=installer_launch_args('setup.exe',executable='C:/Apps/Draw Studio/DrawStudio.exe')\n        # Pure path logic is platform-independent; the legacy executable name must still be recognized.\n        self.assertIn('/RELAUNCHIMAGEDRAWBOT',args)\n\nif __name__=='__main__': unittest.main()\n'''
          write('test_rebrand_v10144.py', rebrand_test)

          # The transient workflow deletes itself in the rebrand commit.
          Path('.github/workflows/rebrand-image-draw-bot.yml').unlink()

          # Static sanity checks before committing.
          assert Path('ImageDrawBot.manifest').is_file()
          assert Path('installer/ImageDrawBot.iss').is_file()
          assert not Path('DrawStudio.manifest').exists()
          assert not Path('installer/DrawStudio.iss').exists()
          assert "APP_NAME = 'Image Draw Bot'" in read('Version.py')
          assert 'GITHUB_REPOSITORY = "Vxiey/Image-Draw-Bot"' in read('UpdateCenter.py')
          assert "'--name', 'ImageDrawBot'" in read('build_exe.py')
          assert 'ImageDrawBot.exe' in read('installer/ImageDrawBot.iss')
          PY

          python -m compileall -q .
          git config user.name "Vxiey"
          git config user.email "84341307+Vxiey@users.noreply.github.com"
          git add -A
          git commit -m "v1.0.144-rc1 rebrand to Image Draw Bot"
          git push origin HEAD:main
