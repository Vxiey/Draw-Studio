name: Apply Image Draw Bot rebrand

on:
  push:
    branches: [main]
    paths:
      - 'tools/rebrand_image_draw_bot_v2.py'
      - '.github/workflows/rebrand-image-draw-bot.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rebrand migration
        run: python tools/rebrand_image_draw_bot_v2.py

      - name: Compile source
        run: python -m compileall -q .

      - name: Commit rebrand to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vxiey"
          git config user.email "84341307+Vxiey@users.noreply.github.com"
          git add -A
          git commit -m "v1.0.144-rc1 rebrand to Image Draw Bot"
          git push origin HEAD:main
