name: Paint runtime integration patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/paint-runtime-patch-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Paint-only runtime patch
        shell: pwsh
        run: |
          python paint_runtime_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Paint regressions
        shell: pwsh
        run: |
          python -m unittest -v test_stroke_delivery_v1062.py test_per_game_input_engine_v1075.py test_paint_custom_color_auto_v10130.py test_custom_palette_v1034.py test_custom_palette_verification_v108.py test_adaptive_color_v1035.py test_advanced_color_matching_v109.py test_paint_color_verification_v10122.py test_paint_color_recovery_v10124.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile StrokeDelivery.py ExactColorTools.py DynamicColors.py DrawBot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regression suite
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated Paint patch
        shell: pwsh
        run: |
          git config user.name "Draw Studio CI"
          git config user.email "actions@users.noreply.github.com"
          git add StrokeDelivery.py ExactColorTools.py DrawBot.py test_stroke_delivery_v1062.py test_per_game_input_engine_v1075.py test_paint_custom_color_auto_v10130.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Paint patch produced no source changes' }
          git commit -m "Fix Paint line delivery and automatic custom colors"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
