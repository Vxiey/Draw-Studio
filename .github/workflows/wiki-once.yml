name: Publish Draw Studio wiki once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wiki-once.yml'

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Build wiki pages
        shell: bash
        run: |
          mkdir -p wiki-out
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          out = Path('wiki-out')
          pages = {
          'Home.md': r'''
          # Draw Studio Wiki

          **Draw Studio** is a Windows auto-draw and drawing automation app for **Gartic Phone, Skribbl.io, Microsoft Paint and supported browser drawing apps**.

          Choose an image, select the drawing canvas, and Draw Studio recreates the image using optimized mouse paths, calibrated colors, fills, previews and detail-preserving render modes.

          > **Gartic Phone users:** Google Chrome with **Artist Tools for Gartic Phone** installed and enabled is required for the supported Gartic Phone workflow.

          ## Start here

          - [Getting Started](Getting-Started)
          - [Installation](Installation)
          - [First Use](First-Use)
          - [Gartic Phone Setup](Gartic-Phone)
          - [Skribbl.io Setup](Skribbl-io)
          - [Microsoft Paint Setup](Microsoft-Paint)
          - [Drawing Modes](Drawing-Modes)
          - [Troubleshooting](Troubleshooting)

          ## Current beta

          **v1.0.124-beta — Step 26**

          Current focus includes Pixel Accurate planning, detail fidelity, color matching and Named Color Intelligence.

          ## Important controls

          - **Esc** — stop drawing immediately
          - **F6** — pause or resume

          Draw Studio does not use AI image generation. It analyzes the source image and recreates it with normal drawing actions.
          ''',
          'Getting-Started.md': r'''
          # Getting Started

          The fastest way to understand Draw Studio is:

          1. Install or extract Draw Studio.
          2. Open the program or website you want to draw in.
          3. Choose the matching Draw Studio profile.
          4. Load an image.
          5. Calibrate colors/tools when required.
          6. Select only the actual drawing canvas.
          7. Run the mouse test and Fast Dry Run.
          8. Check the preview.
          9. Start drawing.

          ## Recommended first target

          **Microsoft Paint** is recommended for the first test because it is easier to verify canvas position, colors and brush settings.

          ## Before a full drawing

          Always run:

          - mouse movement test
          - small drawing test
          - Safety Preflight
          - Fast Dry Run
          - preview check

          If the target window is moved, resized or zoomed after calibration, verify the canvas again.
          ''',
          'Installation.md': r'''
          # Installation

          ## Source ZIP requirements

          - Windows 10 or Windows 11, 64-bit
          - Python 3.10 or newer
          - Internet access during the first dependency installation
          - The entire ZIP extracted to a normal writable folder

          Do **not** run Draw Studio directly from inside the ZIP archive.

          ## Starting the source build

          Run:

          ```bat
          Start.bat
          ```

          On first launch, Draw Studio creates a private `.venv`, installs the required Python packages and checks optional GPU acceleration.

          Main dependencies include:

          - Python
          - NumPy
          - Pillow
          - CustomTkinter / Tkinter
          - keyboard
          - tkinterdnd2
          - requests
          - qrcode

          ## Packaged EXE

          A packaged `DrawStudio.exe` does not require a separate Python installation.

          ## Gartic Phone extra requirement

          Gartic Phone requires **Google Chrome** and **Artist Tools for Gartic Phone**:

          https://chromewebstore.google.com/detail/artist-tools-for-gartic-p/jimdddbdlngpncjdbfggmjieegcnjcbd
          ''',
          'First-Use.md': r'''
          # First Use

          ## 1. Open your drawing target

          Open Microsoft Paint, Gartic Phone, Skribbl.io or another supported target.

          ## 2. Select the correct profile

          Profiles keep their own calibration and settings. Do not calibrate one target while another profile is selected.

          ## 3. Load an image

          Use the image selector, drag-and-drop or paste when supported.

          ## 4. Calibrate

          Follow the in-app calibration guide for colors and tools.

          ## 5. Select the drawing area

          Select **only the canvas**. Do not include buttons, toolbars, menus or browser UI.

          ## 6. Verify safety

          Run the mouse test, small drawing test, Safety Preflight and Fast Dry Run.

          ## 7. Choose a render mode

          Start with **Balanced** or **Fast**. Use Pixel Accurate only when detail is more important than speed.
          ''',
          'Gartic-Phone.md': r'''
          # Gartic Phone Setup

          Draw Studio supports a dedicated Gartic Phone workflow.

          ## Required

          - Google Chrome
          - Gartic Phone open in Chrome
          - **Artist Tools for Gartic Phone** installed and enabled
          - Gartic Phone profile selected in Draw Studio

          Install Artist Tools from the Chrome Web Store:

          https://chromewebstore.google.com/detail/artist-tools-for-gartic-p/jimdddbdlngpncjdbfggmjieegcnjcbd

          ## Setup order

          1. Install and enable Artist Tools.
          2. Reload Gartic Phone.
          3. Open a drawing canvas.
          4. Select the Gartic Phone profile in Draw Studio.
          5. Run calibration/preflight if requested.
          6. Select the exact canvas area.
          7. Use Fast or Extra Fast for short timers.

          ## If drawing is offset

          Recheck browser zoom, window size and canvas selection. Recalibrate if the browser layout changed.
          ''',
          'Skribbl-io.md': r'''
          # Skribbl.io Setup

          ## Basic setup

          1. Open Skribbl.io in your browser.
          2. Keep the browser window at a stable size and zoom level.
          3. Select the Skribbl profile in Draw Studio.
          4. Load the source image.
          5. Select the drawing canvas only.
          6. Run preflight and preview before starting.

          Short game timers usually work best with **Fast** or **Extra Fast** modes.

          If the palette or browser layout changes, verify calibration again.
          ''',
          'Microsoft-Paint.md': r'''
          # Microsoft Paint Setup

          Microsoft Paint is the recommended target for learning Draw Studio.

          ## First setup

          1. Open Paint with a blank image.
          2. Choose the brush/tool you want to use.
          3. Select the Microsoft Paint profile in Draw Studio.
          4. Load your source image.
          5. Run Paint color/tool calibration when needed.
          6. Select only the Paint image canvas.
          7. Run mouse and small-drawing tests.
          8. Check Fast Dry Run and preview.

          Keep Paint and Draw Studio at the same Windows privilege level. Normally, run both without administrator rights.
          ''',
          'Drawing-Modes.md': r'''
          # Drawing Modes

          ## Fast

          Prioritizes completion speed. Good for timed drawing games.

          ## Extra Fast

          Uses aggressive path planning plus outlines/fills where suitable. Best when the timer is very short.

          ## Balanced / Normal

          Recommended for most drawings. Balances speed, detail and color accuracy.

          ## Pixel Accurate

          Prioritizes source-image fidelity. It uses full-resolution planning, importance/detail maps and stronger protection for tiny features.

          Pixel Accurate can create much more drawing work, so it is normally slower.

          ## Choosing a mode

          | Goal | Recommended mode |
          | --- | --- |
          | Very short game timer | Extra Fast |
          | Speed | Fast |
          | General use | Balanced |
          | Maximum detail | Pixel Accurate |
          ''',
          'Color-Engine.md': r'''
          # Color Engine

          Draw Studio maps source-image colors to colors the selected target can actually draw.

          The color system includes:

          - OKLab-based perceptual color matching
          - calibrated target palettes
          - color grouping and reduction
          - Named Color Intelligence
          - CSS4 and Tk/X11 compatible color names
          - RGB, RGBA, ARGB and HEX parsing
          - human-readable color diagnostics

          Named colors are diagnostic/input helpers. They do **not** automatically add extra colors to a calibrated target palette.
          ''',
          'Performance-and-GPU.md': r'''
          # Performance and GPU

          Draw Studio can use CPU and optional GPU acceleration for supported workloads.

          ## CPU

          The application can fall back to CPU processing when GPU acceleration is unavailable.

          ## NVIDIA

          CuPy/CUDA acceleration may be used when compatible. A suitable NVIDIA driver is required; the normal source setup does not require a separate system-wide CUDA Toolkit.

          ## AMD / Intel / NVIDIA

          PyOpenCL can use supported OpenCL runtimes supplied by graphics drivers.

          ## If rendering is slow

          - use Fast or Extra Fast
          - reduce unnecessary source detail
          - use a smaller canvas
          - use fills where supported
          - avoid Pixel Accurate for short timers
          - check CPU/GPU/RAM allocation settings
          ''',
          'Safety-and-Privacy.md': r'''
          # Safety and Privacy

          Draw Studio contains multiple canvas-safety layers designed to stop mouse drawing from leaving the selected target area.

          Safety components include canvas bounds, safe polygons, brush insets, fill masks, segment clipping and final mouse guards.

          ## Privacy

          Draw Studio is designed to work locally:

          - no telemetry
          - no automatic crash-report upload
          - no remote bug-report backend
          - no automatic diagnostics upload
          - local runtime safety reports

          Loading an image from a URL is one of the normal features that can make an HTTP/HTTPS request when explicitly used.
          ''',
          'Troubleshooting.md': r'''
          # Troubleshooting

          ## Mouse draws in the wrong place

          1. Press **Esc**.
          2. Confirm the correct profile.
          3. Re-select the drawing area.
          4. Recalibrate if the target moved/resized.
          5. Run the mouse test again.

          ## Wrong colors

          - re-run color calibration
          - verify the correct profile
          - make sure the target palette has not changed
          - check the preview

          ## Gartic Phone does not work

          - use Google Chrome
          - install and enable Artist Tools for Gartic Phone
          - reload Gartic Phone
          - select the Gartic Phone profile
          - verify browser zoom/layout

          ## Too slow

          Use Fast/Extra Fast, reduce detail, use a smaller canvas or enable appropriate hardware allocation.

          ## Small details disappear

          Try Pixel Accurate, a larger canvas and/or a smaller brush.

          ## Python not found

          Install 64-bit Python 3.10+ and enable **Add Python to PATH**, then run `Start.bat` again.

          ## GPU unavailable

          GPU acceleration is optional. Update the graphics driver; Draw Studio can continue with CPU fallback.
          ''',
          'FAQ.md': r'''
          # FAQ

          ## Does Draw Studio use AI?

          No. It uses deterministic image processing, color analysis, path planning and mouse automation.

          ## Does Gartic Phone need anything extra?

          Yes. The supported workflow requires Google Chrome with **Artist Tools for Gartic Phone** installed and enabled.

          ## Do I need a GPU?

          No. GPU acceleration is optional; CPU fallback is available.

          ## What should I use first?

          Microsoft Paint with Balanced mode is a good first test.

          ## Why is Pixel Accurate slow?

          It preserves more source detail and therefore creates more drawing work.

          ## Can I move the target window while drawing?

          Avoid it. Moving, resizing or zooming the target can invalidate calibration/canvas alignment.
          ''',
          'Developer-Guide.md': r'''
          # Developer Guide

          Draw Studio is mainly written in **Python 3.10+**.

          Main technologies:

          - Python
          - Tkinter + CustomTkinter
          - NumPy
          - Pillow
          - OKLab color math
          - optional CuPy/CUDA
          - optional PyOpenCL
          - PyInstaller
          - Inno Setup
          - GitHub Actions

          ## Run tests

          ```powershell
          python -m unittest discover -v
          python DrawBot.py --self-test
          ```

          ## Build a Windows release

          ```bat
          Build-Release.bat
          ```

          Build artifacts are written to `release\\`.
          ''',
          '_Sidebar.md': r'''
          **Draw Studio Wiki**

          - [Home](Home)
          - [Getting Started](Getting-Started)
          - [Installation](Installation)
          - [First Use](First-Use)

          **Targets**
          - [Gartic Phone](Gartic-Phone)
          - [Skribbl.io](Skribbl-io)
          - [Microsoft Paint](Microsoft-Paint)

          **Features**
          - [Drawing Modes](Drawing-Modes)
          - [Color Engine](Color-Engine)
          - [Performance & GPU](Performance-and-GPU)
          - [Safety & Privacy](Safety-and-Privacy)

          **Help**
          - [Troubleshooting](Troubleshooting)
          - [FAQ](FAQ)
          - [Developer Guide](Developer-Guide)
          ''',
          '_Footer.md': r'''
          **Draw Studio** · Windows auto-draw for Gartic Phone, Skribbl.io and Microsoft Paint · [Main repository](https://github.com/Vxiey/Draw-Studio)
          ''',
          }

          for name, text in pages.items():
              (out / name).write_text(dedent(text).strip() + '\n', encoding='utf-8')
          print(f'Built {len(pages)} wiki files')
          PY

      - name: Publish wiki repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          WIKI_URL="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          if git ls-remote "$WIKI_URL" >/tmp/wiki-refs 2>/dev/null && [ -s /tmp/wiki-refs ]; then
            git clone "$WIKI_URL" wiki-repo
            cp wiki-out/*.md wiki-repo/
            cd wiki-repo
          else
            mkdir wiki-repo
            cp wiki-out/*.md wiki-repo/
            cd wiki-repo
            git init -b master
            git remote add origin "$WIKI_URL"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki is already up to date.'
            exit 0
          fi
          git commit -m 'Create Draw Studio user wiki'
          git push origin HEAD:master
