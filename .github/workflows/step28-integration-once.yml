name: Step 28 more drawing targets integration once
# retry: corrected Step 28 + legacy version assertions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step28-integration-once.yml'

permissions:
  contents: write

jobs:
  integrate-step28:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Step 28 integration
        run: python step28_integrate_once.py

      - name: Run Step 28 regressions
        shell: pwsh
        run: |
          python -m unittest -v test_target_capabilities_v10127.py test_step28_more_targets_v10127.py test_one_click_setup_verification_v10126.py test_profile_isolation_v107.py test_profile_switch_safety.py test_step9_profile_calibration_isolation_v10133.py test_profile_engine_v1045.py test_step11_ui_profiles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile TargetCapabilities.py GameProfiles.py ProfileEngine.py BrowserAutoCalibration.py SmartRecovery.py StrokeDeliveryVerification.py OneClickSetupVerification.py ProfileIsolation.py BeginnerSetupWizard.py StudioUI.py AppTools.py build_exe.py Version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit integrated Step 28
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BrowserAutoCalibration.py SmartRecovery.py StrokeDeliveryVerification.py OneClickSetupVerification.py ProfileIsolation.py BeginnerSetupWizard.py StudioUI.py AppTools.py GameProfiles.py ProfileEngine.py build_exe.py Version.py ROADMAP-STEP22-PLUS.md
          git commit -m 'Complete Step 28 more drawing targets'
          git push
