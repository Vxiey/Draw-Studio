name: Implement Image Draw Bot rc11

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc11-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc11 Smart Color Engine patch
        run: python .github/rc11_patch.py
      - name: Run rc11 focused regressions
        run: |
          python -m unittest -v test_rc11_smart_color_engine.py
          python -m unittest -v test_adaptive_palette_fidelity_v10123.py test_step3_dominant_hue_preservation_v10127.py test_step4_region_aware_quantization_v10128.py
          python -m py_compile SmartColorEngine.py AdaptivePaletteFidelity.py Version.py
      - name: Commit rc11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/rc11_patch.py .github/implement-rc11-trigger .github/workflows/implement-rc11.yml
          git add SmartColorEngine.py AdaptivePaletteFidelity.py Version.py installer/ImageDrawBot.iss README.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc11.md test_*.py
          git commit -m "Implement rc11 Smart Color Engine"
          git push origin main
