name: Integrate rc28 drawing style profiles v2

on:
  push:
    branches: [feature/background-remover-png-rc28]
    paths:
      - '.github/rc28-style-trigger-v2'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/background-remover-png-rc28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply drawing style integration
        run: python .github/scripts/implement_rc28_styles_v2.py
      - name: Compile changed modules
        run: python -m py_compile DrawingStyleProfiles.py AutoDrawing.py DrawBot.py StudioUI.py ProfileIsolation.py DrawTimeCalibration.py
      - name: Run rc28 style tests
        run: python -m unittest -v test_rc28_drawing_style_profiles.py test_profile_isolation_v107.py test_auto_brush_total_time_v10144.py test_draw_motor_v1090.py
      - name: Commit integrated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AutoDrawing.py DrawBot.py StudioUI.py ProfileIsolation.py SessionRecovery.py DrawTimeCalibration.py build_exe.py Version.py installer/ImageDrawBot.iss
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate drawing style profiles for rc28'
            git push origin HEAD:feature/background-remover-png-rc28
          fi
