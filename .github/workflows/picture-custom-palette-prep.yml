name: Picture custom palette prep

on:
  push:
    branches:
      - v1.0.142-picture-custom-palette
    paths:
      - '.github/workflows/picture-custom-palette-prep.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Paint picture palette UI and calibration fallback
        shell: python
        run: |
          from pathlib import Path

          ui = Path('StudioUI.py')
          text = ui.read_text(encoding='utf-8')
          anchor = "from Version import APP_VERSION\n"
          insert = "from Version import APP_VERSION\nfrom PictureCustomPalette import start_picture_custom_palette\n"
          if 'from PictureCustomPalette import start_picture_custom_palette' not in text:
              if anchor not in text:
                  raise SystemExit('StudioUI import anchor not found')
              text = text.replace(anchor, insert, 1)

          old = """    a.exact_color_button = btn(step3, '🌈  Smart custom palette / exact color', a.calibrate_exact_colors, height=34)\n    a.exact_color_button.pack(fill='x', pady=(2, 0))\n    label(step3, var=a.exact_color_text, muted=True, wraplength=270, size=9).pack(anchor='w', pady=(4, 4))\n    a.area_button = btn(step3, '▣  Select drawing area', a.set_boundary, height=37)\n"""
          new = """    a.exact_color_button = btn(step3, '🌈  Smart custom palette / exact color', a.calibrate_exact_colors, height=34)\n    a.exact_color_button.pack(fill='x', pady=(2, 0))\n    label(step3, var=a.exact_color_text, muted=True, wraplength=270, size=9).pack(anchor='w', pady=(4, 4))\n    a.picture_palette_button = btn(step3, '🖼  Custom color palette for picture', lambda: start_picture_custom_palette(a), height=34)\n    a.picture_palette_button.pack(fill='x', pady=(2, 0))\n    tooltip(a.picture_palette_button, 'Microsoft Paint: analyze the loaded picture, auto-calibrate Edit colors R/G/B if needed, enter the important exact RGB colors, and save the picture palette for this image/calibration.')\n    a.area_button = btn(step3, '▣  Select drawing area', a.set_boundary, height=37)\n"""
          if 'Custom color palette for picture' not in text:
              if old not in text:
                  raise SystemExit('StudioUI picture palette button anchor not found')
              text = text.replace(old, new, 1)

          old_scope = "        (a.paint_auto_button,'paint'),(a.paint_tool_button,'paint'),\n"
          new_scope = "        (a.paint_auto_button,'paint'),(a.paint_tool_button,'paint'),(a.picture_palette_button,'paint'),\n"
          if "(a.picture_palette_button,'paint')" not in text:
              if old_scope not in text:
                  raise SystemExit('StudioUI Paint scope anchor not found')
              text = text.replace(old_scope, new_scope, 1)
          ui.write_text(text, encoding='utf-8')

          module = Path('PictureCustomPalette.py')
          text = module.read_text(encoding='utf-8')
          old_guard = """    from ExactColorTools import numeric_rgb_available\n    if not numeric_rgb_available(PROFILE_KEY):\n        app.status.set(\"Calibrate Paint Edit colors with numeric R/G/B first. Use Prepare Paint automatically or Smart custom palette / exact color.\")\n        return False\n\n"""
          if old_guard in text:
              text = text.replace(old_guard, '', 1)

          old_controls = """        from TargetCapture import probe_handle_isolated\n        meta = probe_handle_isolated(handle)\n        from ExactColorTools import resolved_controls\n        controls = resolved_controls(PROFILE_KEY, tuple(meta[\"client_rect\"]))\n"""
          new_controls = """        from TargetCapture import probe_handle_isolated\n        meta = probe_handle_isolated(handle)\n        from ExactColorTools import numeric_rgb_available, resolved_controls, save as save_exact_colors\n        if not numeric_rgb_available(PROFILE_KEY):\n            # This is deliberately independent from full Paint canvas detection.\n            # A clipped/zoomed canvas must not prevent exact RGB calibration.\n            from PaintPreparation import prepare_controls\n            from CalibrationAnchors import make_anchor\n            app.events.put((\"status\", \"Custom color palette for picture: calibrating Paint Edit colors R/G/B controls…\"))\n            exact_controls = prepare_controls(handle, cancelled=app.stop.is_set)\n            meta = probe_handle_isolated(handle)\n            save_exact_colors(PROFILE_KEY, exact_controls, anchor=make_anchor(tuple(meta[\"client_rect\"])))\n        controls = resolved_controls(PROFILE_KEY, tuple(meta[\"client_rect\"]))\n"""
          if 'A clipped/zoomed canvas must not prevent exact RGB calibration.' not in text:
              if old_controls not in text:
                  raise SystemExit('PictureCustomPalette control anchor not found')
              text = text.replace(old_controls, new_controls, 1)

          old_state = """        app.picture_custom_palette_state = dict(\n            palette.as_dict(), image_id=source_id, prepared_count=completed,\n            cache_file=str(cache_path(palette.image_fingerprint, palette.calibration_fingerprint)),\n        )\n"""
          new_state = """        app.picture_custom_palette_state = dict(\n            palette.as_dict(), image_id=source_id, prepared_count=completed,\n            cache_file=str(cache_path(palette.image_fingerprint, palette.calibration_fingerprint)),\n        )\n        # Seed only the method preference, never a fake verification result.\n        # Runtime still performs its normal first-stroke color verification.\n        try:\n            from AdaptiveColor import rgb_key\n            session = getattr(app, 'color_session_cache', None)\n            if isinstance(session, dict):\n                for rgb in custom:\n                    session[rgb_key(rgb)] = {\n                        'method':'numeric', 'confidence':0.0, 'actual':(), 'sample':None,\n                        'prepared_picture_palette':True,\n                    }\n        except Exception:\n            pass\n"""
          if 'prepared_picture_palette' not in text:
              if old_state not in text:
                  raise SystemExit('PictureCustomPalette cache-state anchor not found')
              text = text.replace(old_state, new_state, 1)
          module.write_text(text, encoding='utf-8')

      - name: Compile changed Python
        run: python -m py_compile PictureCustomPalette.py StudioUI.py test_picture_custom_palette_v10142.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add StudioUI.py PictureCustomPalette.py test_picture_custom_palette_v10142.py
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate picture custom palette with Paint color calibration'
            git push origin HEAD:v1.0.142-picture-custom-palette
          fi
