name: Prepare v1.0.143-rc2 metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-v10143rc2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize rc2 metadata except Version.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD='1.0.143-rc1'
          NEW='1.0.143-rc2'
          changed=[]

          def write(path, text):
              path=Path(path)
              old=path.read_text(encoding='utf-8') if path.exists() else None
              if old != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          # Update only current-version assertions; leave synthetic updater
          # fixture versions untouched.
          for path in Path('.').rglob('test_*.py'):
              text=path.read_text(encoding='utf-8')
              lines=[]
              for line in text.splitlines(keepends=True):
                  if 'APP_VERSION' in line and OLD in line:
                      line=line.replace(OLD,NEW)
                  lines.append(line)
              write(path,''.join(lines))

          path=Path('installer/DrawStudio.iss')
          text=path.read_text(encoding='utf-8')
          text=text.replace('#define MyAppVersion "1.0.143-rc1"','#define MyAppVersion "1.0.143-rc2"')
          # FILE_VERSION intentionally remains 1.0.143 for rc2.
          write(path,text)

          for name in ('README.md','README-INDEX.md','docs/IN-APP-UPDATES.md'):
              path=Path(name)
              if path.exists():
                  write(path,path.read_text(encoding='utf-8').replace(OLD,NEW))

          section='''# v1.0.143-rc2\n\n- Fix false `Paint canvas visible area is too small` failures on modern Paint.\n- Replace the fixed 35% Paint-window width rule with a DPI-scaled minimum drawable size.\n- Detect compact blank canvases safely even when Paint is maximized and the document occupies only part of the window.\n- Ignore thin Paint resize-handle/edge chrome while finding the blank canvas rectangle, while still rejecting covered or non-blank interiors.\n- Preserve clipped-canvas safety insets and manual fallback for genuinely tiny or ambiguous areas.\n- Add compact-canvas, resize-handle and tiny-area regression coverage.\n\n'''
          for name in ('VERSION-HISTORY.md','docs/VERSION-HISTORY.md'):
              path=Path(name)
              if path.exists():
                  old=path.read_text(encoding='utf-8')
                  if not old.startswith('# v1.0.143-rc2'):
                      write(path,section+old)

          notes='''# Draw Studio 1.0.143-rc2\n\n## Microsoft Paint — compact visible canvas fix\n\n- Fixes the false `Paint canvas visible area is too small. Enlarge Paint or select the drawing area manually.` failure.\n- Auto calibration no longer requires the visible canvas to span 35% of the entire Paint window.\n- The minimum safe drawable area is now DPI-scaled, so a valid compact canvas can be calibrated inside a large/maximized Paint window.\n- Paint resize handles and thin edge chrome are excluded from the blank-canvas measurement instead of splitting one large canvas into smaller fragments.\n- The drawable interior must still be blank and verified, and visible borders must still be distinguishable from Paint workspace.\n- Clipped client edges retain larger safety insets.\n- Genuinely tiny, covered or ambiguous regions still fall back to manual drawing-area selection.\n\n## Regression coverage\n\n- Compact visible canvas accepted.\n- Edge resize handle does not split a blank canvas.\n- Truly tiny visible area remains rejected.\n- Existing full and clipped canvas behavior remains covered.\n- Full Windows/Linux CI and DrawBot Windows self-test are required before publication.\n'''
          write(Path('RELEASE-NOTES-v1.0.143-rc2.md'),notes)

          print(f'Changed {len(changed)} files')
          for item in changed: print(item)
          if len(changed) < 8:
              raise SystemExit('RC metadata sync changed too few files; refusing to commit')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':!.github/workflows/sync-v10143rc2.yml'
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit'
            exit 1
          fi
          git commit -m 'Sync v1.0.143-rc2 release metadata'
          git push origin HEAD:main
