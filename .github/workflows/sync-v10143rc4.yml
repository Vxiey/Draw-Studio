name: Prepare v1.0.143-rc4 metadata

on:
  push:
    branches: [v1.0.143-rc4-release]
    paths:
      - '.github/workflows/sync-v10143rc4.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.143-rc4-release
          fetch-depth: 0
      - name: Synchronize rc4 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          OLD='1.0.143-rc3';NEW='1.0.143-rc4';changed=[]
          def write(path,text):
              path=Path(path);old=path.read_text(encoding='utf-8') if path.exists() else None
              if old!=text:
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8');changed.append(path.as_posix())

          path=Path('Version.py');text=path.read_text(encoding='utf-8')
          write(path,text.replace("APP_VERSION = '1.0.143-rc3'","APP_VERSION = '1.0.143-rc4'"))

          # Update only current-version assertions. Historical/synthetic updater
          # fixtures containing older versions stay untouched.
          for path in Path('.').rglob('test_*.py'):
              text=path.read_text(encoding='utf-8');lines=[]
              for line in text.splitlines(keepends=True):
                  if 'APP_VERSION' in line and OLD in line:line=line.replace(OLD,NEW)
                  lines.append(line)
              write(path,''.join(lines))

          path=Path('installer/DrawStudio.iss');text=path.read_text(encoding='utf-8')
          write(path,text.replace('#define MyAppVersion "1.0.143-rc3"','#define MyAppVersion "1.0.143-rc4"'))

          for name in ('README.md','README-INDEX.md','docs/IN-APP-UPDATES.md'):
              path=Path(name)
              if path.exists():write(path,path.read_text(encoding='utf-8').replace(OLD,NEW))

          section='''# v1.0.143-rc4\n\n- Fix Paint drawing startup when the automatic RGB calibration opens **Edit colors** over the canvas.\n- Require the Edit colors modal to be fully closed before canvas/ribbon verification or drawing preparation can continue.\n- Re-scan the Paint UI after Cancel/OK and retry only the already identified modal control when current XAML Paint closes asynchronously.\n- Reactivate and re-probe the Paint document after RGB calibration before taking any canvas screenshot.\n- Apply the same modal-closure invariant to **Custom color palette for picture**, including a bounded foreground grace period and UIA-confirm fallback only when the Paint modal persists.\n- Never report Paint preparation as ready while Edit colors RGB controls are still visible.\n- Add Windows regressions for delayed modal dismissal, stuck-modal rejection, confirm closure, and Paint reactivation.\n\n'''
          for name in ('VERSION-HISTORY.md','docs/VERSION-HISTORY.md'):
              path=Path(name)
              if path.exists():
                  old=path.read_text(encoding='utf-8')
                  if not old.startswith('# v1.0.143-rc4'):write(path,section+old)

          notes='''# Draw Studio 1.0.143-rc4\n\n## Microsoft Paint — Edit colors no longer blocks drawing\n\n- Fixes the startup failure where Draw Studio opened **Edit colors** to calibrate or enter RGB values, the modal covered the canvas, and the following canvas verification stopped drawing.\n- Automatic Paint preparation now has a hard postcondition: **Edit colors must be closed before canvas verification starts**.\n- Draw Studio verifies that the RGB controls disappeared from Paint's UI Automation tree instead of assuming that a single Cancel/OK invocation closed the XAML modal.\n- If Paint is slow to dismiss the dialog, Draw Studio retries only the already identified Cancel/OK control. It never guesses or clicks a canvas coordinate.\n- After the modal is gone, Paint is explicitly reactivated and its geometry is re-probed before the canvas/ribbon screenshot is taken.\n\n## Picture custom palette\n\n- Picture-specific RGB preparation now waits for Paint to regain foreground ownership after each confirmed color.\n- A lingering Edit colors dialog is explicitly confirmed/closed before the next color or before control returns to Draw Studio.\n- The picture palette cache behavior is unchanged; only modal lifecycle safety is tightened.\n\n## Verification\n\n- Full Windows/Linux CI and DrawBot Windows self-test are required before publication.\n- The Windows release workflow additionally validates package integrity and a silent install → self-test → uninstall round trip.\n'''
          write(Path('RELEASE-NOTES-v1.0.143-rc4.md'),notes)

          print(f'Changed {len(changed)} files')
          for item in changed:print(item)
          if len(changed)<8:raise SystemExit('RC4 metadata sync changed too few files; refusing to commit')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':!.github/workflows/sync-v10143rc4.yml'
          git diff --cached --check
          git commit -m 'Sync v1.0.143-rc4 release metadata'
          git push origin HEAD:v1.0.143-rc4-release
