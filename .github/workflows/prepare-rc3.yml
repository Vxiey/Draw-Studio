name: Prepare Image Draw Bot 1.0.145-rc3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_rc3.py'
      - '.github/workflows/prepare-rc3.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare rc3 metadata and tests
        run: python .github/scripts/prepare_rc3.py
      - name: Commit rc3 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No rc3 changes to commit"; exit 1; }
          git commit -m "Release Image Draw Bot v1.0.145-rc3"
          git push origin HEAD:main
