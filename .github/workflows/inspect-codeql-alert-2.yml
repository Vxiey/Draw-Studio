name: Inspect CodeQL alert 2 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-codeql-alert-2.yml'

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch alert 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "/repos/${REPO}/code-scanning/alerts/2" > alert.json
          python3 - <<'PY'
          import json
          a=json.load(open('alert.json',encoding='utf-8'))
          r=a.get('rule') or {}
          inst=a.get('most_recent_instance') or {}
          loc=inst.get('location') or {}
          print('NUMBER:',a.get('number'))
          print('STATE:',a.get('state'))
          print('RULE_ID:',r.get('id'))
          print('NAME:',r.get('name'))
          print('DESCRIPTION:',r.get('description'))
          print('SEVERITY:',r.get('severity'))
          print('SECURITY_SEVERITY_LEVEL:',r.get('security_severity_level'))
          print('TAGS:',','.join(r.get('tags') or []))
          print('TOOL:',(a.get('tool') or {}).get('name'))
          print('PATH:',loc.get('path'))
          print('START_LINE:',loc.get('start_line'))
          print('END_LINE:',loc.get('end_line'))
          print('MESSAGE:',(inst.get('message') or {}).get('text'))
          print('REF:',inst.get('ref'))
          print('COMMIT_SHA:',inst.get('commit_sha'))
          print('HTML_URL:',a.get('html_url'))
          print('CREATED_AT:',a.get('created_at'))
          print('UPDATED_AT:',a.get('updated_at'))
          print('FIXED_AT:',a.get('fixed_at'))
          print('DISMISSED_REASON:',a.get('dismissed_reason'))
          print('DISMISSED_COMMENT:',a.get('dismissed_comment'))
          PY
