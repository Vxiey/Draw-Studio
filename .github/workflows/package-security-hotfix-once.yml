name: Package Step 26 security hotfix once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-security-hotfix-once.yml'

permissions:
  contents: write

jobs:
  package-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify security regression
        run: |
          python -m unittest -v test_canvas_drop_payload_security.py
          python -m py_compile CanvasDropPayload.py

      - name: Build and verify security hotfix ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import zipfile

          old_name = 'Draw-Studio-1.0.124-beta-Step26-Color-Engine-Named-Color-Intelligence.zip'
          new_name = 'Draw-Studio-1.0.124-beta-Step26-Security-Hotfix.zip'
          release_name = 'RELEASE-NOTES-v1.0.124-beta-Step26-Security-Hotfix.md'
          old_zip = Path(old_name)
          new_zip = Path(new_name)
          work = Path('.hotfix-package')

          if not old_zip.is_file():
              raise SystemExit(f'Missing baseline package: {old_name}')

          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile(old_zip, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Baseline ZIP is corrupt at: {bad}')
              zf.extractall(work)

          targets = list(work.rglob('CanvasDropPayload.py'))
          if len(targets) != 1:
              raise SystemExit(f'Expected exactly one CanvasDropPayload.py in baseline ZIP, found {len(targets)}')
          target = targets[0]
          package_root = target.parent

          # Patch only the security-sensitive source and add its regression test.
          target.write_bytes(Path('CanvasDropPayload.py').read_bytes())
          (package_root / 'test_canvas_drop_payload_security.py').write_bytes(
              Path('test_canvas_drop_payload_security.py').read_bytes()
          )

          release_text = '''# Draw Studio v1.0.124-beta Step 26 — Security Hotfix

This hotfix keeps the existing Step 26 Detail Fidelity, Pixel Accurate and Named Color Intelligence release intact while applying the URL-hostname validation security fix.

## Fixed

- Fixes GitHub CodeQL alert #2: `py/incomplete-url-substring-sanitization`.
- Replaces substring-based Bing/Google hostname recognition with exact domain/subdomain validation.
- Prevents deceptive hostnames such as `bing.com.evil.example` and `notbing.com` from being treated as Bing.
- Prevents a domain name appearing only in a URL path or query from being treated as a trusted image-search host.
- Applies the same hostname-label validation to supported Google image/CDN domains.
- Adds `test_canvas_drop_payload_security.py` regression coverage.

## Verification

- Security regression tests pass.
- `CanvasDropPayload.py` compiles successfully.
- GitHub CodeQL marked alert #2 as `fixed` on 2026-09-08.
- The packaged hotfix is checked for ZIP integrity and for removal of the vulnerable substring check.

## Unchanged

The application version remains `1.0.124-beta`. Pixel Accurate planning, Named Color Intelligence, calibrated palettes, CanvasGuard, profile isolation and renderer behavior are otherwise unchanged.
'''
          Path(release_name).write_text(release_text, encoding='utf-8')
          (package_root / release_name).write_text(release_text, encoding='utf-8')

          if new_zip.exists():
              new_zip.unlink()
          with zipfile.ZipFile(new_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(work.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.relative_to(work).as_posix())

          with zipfile.ZipFile(new_zip, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Hotfix ZIP is corrupt at: {bad}')
              names = set(zf.namelist())
              canvas_entries = [n for n in names if n.endswith('CanvasDropPayload.py')]
              test_entries = [n for n in names if n.endswith('test_canvas_drop_payload_security.py')]
              if len(canvas_entries) != 1 or len(test_entries) != 1:
                  raise SystemExit('Hotfix ZIP is missing the patched source or regression test')
              patched = zf.read(canvas_entries[0]).decode('utf-8')
              if '_host_is_or_subdomain' not in patched:
                  raise SystemExit('Hotfix helper is missing from packaged CanvasDropPayload.py')
              if "elif 'bing.com' in host" in patched or "'bing.com' in host" in patched:
                  raise SystemExit('Vulnerable Bing hostname substring check remains in package')

          digest = hashlib.sha256(new_zip.read_bytes()).hexdigest()
          Path('SOURCE-PACKAGE-SHA256.txt').write_text(f'{digest}  {new_name}\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(old_name, new_name)
          readme = readme.replace(
              'SHA-256: `34dc39349b544e202166648df972ba2a07519262b425609fe5cd578566d98f49`',
              f'SHA-256: `{digest}`'
          )
          readme = readme.replace(
              '**v1.0.124-beta — Step 26: Detail Fidelity, Pixel-Accurate Planning & Named Color Intelligence**',
              '**v1.0.124-beta — Step 26: Detail Fidelity, Pixel-Accurate Planning, Named Color Intelligence & Security Hotfix**'
          )
          marker = '### Step 26 highlights\n'
          security_section = '''### Security hotfix\n\n- Hardened image-search URL parsing against deceptive Bing/Google hostnames\n- Domain checks now use the parsed hostname and real DNS label boundaries\n- Added regression tests for hostname spoofing and path/query lookalikes\n- GitHub CodeQL alert #2 is confirmed **fixed**\n\n'''
          if security_section not in readme and marker in readme:
              readme = readme.replace(marker, security_section + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')

          print(f'HOTFIX_ZIP={new_name}')
          print(f'SIZE={new_zip.stat().st_size}')
          print(f'SHA256={digest}')
          print(f'PATCHED_ENTRY={target.relative_to(work).as_posix()}')
          print('ZIP_INTEGRITY=PASS')
          print('SECURITY_CONTENT_CHECK=PASS')
          PY

      - name: Commit hotfix package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Draw-Studio-1.0.124-beta-Step26-Security-Hotfix.zip \
            SOURCE-PACKAGE-SHA256.txt \
            RELEASE-NOTES-v1.0.124-beta-Step26-Security-Hotfix.md \
            README.md
          git commit -m 'Add v1.0.124-beta Step 26 security hotfix package'
          git push
