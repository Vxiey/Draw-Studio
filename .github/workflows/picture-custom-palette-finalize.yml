name: Picture custom palette finalize

on:
  push:
    branches:
      - v1.0.142-picture-custom-palette
    paths:
      - '.github/workflows/picture-custom-palette-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make exact RGB calibration independent from canvas detection
        shell: python
        run: |
          from pathlib import Path

          p = Path('PictureCustomPalette.py')
          text = p.read_text(encoding='utf-8')
          old_prefix = '''    palette_path = getattr(app, "calibration_path", None)\n    try:\n        from ProfileStorage import calibration_context_fingerprint\n        calibration_fp = calibration_context_fingerprint(\n            PROFILE_KEY, workflow="picture-custom-palette", palette_path=palette_path,\n            extras=(f"colors:{max_colors}", f"fidelity:{fidelity}"),\n        )\n    except Exception:\n        calibration_fp = ""\n\n    def work():\n        if getattr(app, "stop", None) is not None and app.stop.is_set():\n            raise InterruptedError("Picture custom palette cancelled.")\n        from Colors import allColors\n        fallback = tuple(tuple(c.RGB) for c in allColors)\n        palette = build_picture_palette(\n            source, fallback, max_colors=max_colors, fidelity=fidelity,\n            calibration_fingerprint=calibration_fp,\n            cancelled=app.stop.is_set,\n        )\n        if id(getattr(app, "original", None)) != source_id:\n            raise InterruptedError("Source image changed while the picture palette was being prepared.")\n        handle, rect = _resolve_target(app, app.stop.is_set)\n'''
          new_prefix = '''    palette_path = getattr(app, "calibration_path", None)\n\n    def work():\n        if getattr(app, "stop", None) is not None and app.stop.is_set():\n            raise InterruptedError("Picture custom palette cancelled.")\n        # Resolve Paint and its RGB controls before fingerprinting the palette.\n        # If this is the first run, the exact-color calibration file is created\n        # below; the resulting fingerprint therefore stays reusable on later runs.\n        handle, rect = _resolve_target(app, app.stop.is_set)\n'''
          if old_prefix not in text:
              raise SystemExit('Picture palette work-prefix anchor not found')
          text = text.replace(old_prefix, new_prefix, 1)

          old_after_controls = '''        controls = resolved_controls(PROFILE_KEY, tuple(meta["client_rect"]))\n        custom = tuple(palette.custom_colors)\n'''
          new_after_controls = '''        controls = resolved_controls(PROFILE_KEY, tuple(meta["client_rect"]))\n        try:\n            from ProfileStorage import calibration_context_fingerprint\n            calibration_fp = calibration_context_fingerprint(\n                PROFILE_KEY, workflow="picture-custom-palette", palette_path=palette_path,\n                extras=(f"colors:{max_colors}", f"fidelity:{fidelity}"),\n            )\n        except Exception:\n            calibration_fp = ""\n        from Colors import allColors\n        fallback = tuple(tuple(c.RGB) for c in allColors)\n        palette = build_picture_palette(\n            source, fallback, max_colors=max_colors, fidelity=fidelity,\n            calibration_fingerprint=calibration_fp, cancelled=app.stop.is_set,\n        )\n        if id(getattr(app, "original", None)) != source_id:\n            raise InterruptedError("Source image changed while the picture palette was being prepared.")\n        custom = tuple(palette.custom_colors)\n'''
          if old_after_controls not in text:
              raise SystemExit('Picture palette controls anchor not found')
          text = text.replace(old_after_controls, new_after_controls, 1)
          p.write_text(text, encoding='utf-8')

          bot = Path('DrawBot.py')
          text = bot.read_text(encoding='utf-8')
          old = '''                meta=probe_handle_isolated(int(candidate['handle']))\n                exact_controls=prepare_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                rect=tuple(meta['client_rect'])\n                shot=ImageGrab.grab(bbox=rect,all_screens=True)\n'''
          new = '''                meta=probe_handle_isolated(int(candidate['handle']))\n                exact_controls=prepare_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                rect=tuple(meta['client_rect'])\n                # Exact RGB controls are independent from canvas detection. Save\n                # them as soon as Edit colors has been identified, so a clipped\n                # Paint canvas can fall back to manual area selection without\n                # losing working custom-color calibration.\n                from ExactColorTools import save as save_exact_colors\n                from CalibrationAnchors import make_anchor\n                save_exact_colors('microsoft-paint',exact_controls,anchor=make_anchor(rect))\n                shot=ImageGrab.grab(bbox=rect,all_screens=True)\n'''
          if old not in text:
              raise SystemExit('DrawBot exact-color save anchor not found')
          text = text.replace(old, new, 1)
          old_late = '''                from ExactColorTools import save as save_exact_colors\n                from CalibrationAnchors import make_anchor\n                save_exact_colors('microsoft-paint',exact_controls,anchor=make_anchor(rect))\n                result=save_setup(result,meta,palette_path)\n'''
          if old_late not in text:
              raise SystemExit('DrawBot late exact-color save anchor not found')
          text = text.replace(old_late, '''                result=save_setup(result,meta,palette_path)\n''', 1)
          bot.write_text(text, encoding='utf-8')

      - name: Compile changed Python
        run: python -m py_compile PictureCustomPalette.py DrawBot.py StudioUI.py test_picture_custom_palette_v10142.py
      - name: Commit final integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PictureCustomPalette.py DrawBot.py StudioUI.py test_picture_custom_palette_v10142.py
          git commit -m 'Decouple Paint RGB calibration from canvas detection'
          git push origin HEAD:v1.0.142-picture-custom-palette
