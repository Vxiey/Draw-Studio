name: Prepare Image Draw Bot 1.0.145-rc2

on:
  push:
    paths:
      - '.github/workflows/prepare-rc2.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Apply rc2 Gartic automation patch
        run: python .github/scripts/prepare_rc2.py
      - name: Compile changed Python
        run: python -m py_compile DrawBot.py BrowserBrushSize.py BrowserToolLayout.py AppTools.py build_exe.py Version.py
      - name: Run focused Gartic and brush regressions
        run: python -m unittest -v test_browser_tool_layout_v10145.py test_browser_brush_size_v1074.py test_auto_brush_selector.py
      - name: Commit prepared rc2 source
        shell: bash
        run: |
          git config user.name "Vxiey"
          git config user.email "84341307+Vxiey@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No rc2 changes to commit"; exit 1; }
          git commit -m "Image Draw Bot v1.0.145-rc2 - Gartic Auto Tools"
          git push origin HEAD:main
