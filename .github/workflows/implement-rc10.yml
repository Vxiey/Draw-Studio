name: Implement Image Draw Bot rc10

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc10-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc10
        run: python .github/rc10_patch.py
      - name: Focused tests
        run: |
          python -m unittest -v test_rc10_pixel_accuracy_2.py
          python -m unittest -v test_pixel_accuracy_engine_v1088.py test_draw_motor_v1090.py test_pixel_performance_v1089.py
          python -m py_compile PixelAccuracyEngine.py Version.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/rc10_patch.py .github/implement-rc10-trigger .github/workflows/implement-rc10.yml
          git add PixelAccuracyEngine.py Version.py installer/ImageDrawBot.iss README.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc10.md test_*.py
          git commit -m "Implement rc10 Pixel Accuracy 2.0"
          git push origin main
