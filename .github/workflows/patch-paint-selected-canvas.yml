name: Wire selected Paint canvas into auto preparation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-paint-selected-canvas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch DrawBot Paint preparation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('DrawBot.py')
          text=path.read_text(encoding='utf-8')

          old="""        palette_path=Path(self.calibration_path)\n        request={'image':self.original} if start_after else None\n        self.paint_start_request=request\n        def work():\n"""
          new="""        palette_path=Path(self.calibration_path)\n        request={'image':self.original} if start_after else None\n        self.paint_start_request=request\n        # Snapshot an explicit user-selected canvas on the UI thread. Paint's\n        # pale document border can be visually ambiguous, but a manual selection\n        # is already the user's hard CanvasGuard boundary and should not be\n        # discarded by a later automatic border guess.\n        selected_canvas_state=None\n        try:\n            if len(self.corners)==2 and self.target_window is not None and self.target_client_rect is not None:\n                selected_canvas_state={\n                    'handle':int(self.target_window[0]),\n                    'client_rect':tuple(map(int,self.target_client_rect)),\n                    'corners':tuple(tuple(map(int,p)) for p in self.corners),\n                }\n        except (TypeError,ValueError,OverflowError):\n            selected_canvas_state=None\n        def work():\n"""
          if old not in text:raise SystemExit('DrawBot Paint request anchor not found')
          text=text.replace(old,new,1)

          old="from PaintFullCalibration import choose_paint_window,detect_setup,save_setup"
          new="from PaintFullCalibration import choose_paint_window,detect_setup,save_setup,resolve_manual_canvas_override"
          if old not in text:raise SystemExit('PaintFullCalibration import anchor not found')
          text=text.replace(old,new,1)

          old="""                rect=tuple(meta['client_rect'])\n                # Exact RGB controls are independent from canvas detection. Save\n"""
          new="""                rect=tuple(meta['client_rect'])\n                manual_canvas=None\n                if selected_canvas_state is not None:\n                    manual_canvas=resolve_manual_canvas_override(\n                        selected_canvas_state['corners'],selected_canvas_state['handle'],\n                        selected_canvas_state['client_rect'],int(candidate['handle']),rect)\n                # Exact RGB controls are independent from canvas detection. Save\n"""
          if old not in text:raise SystemExit('Paint client rect anchor not found')
          text=text.replace(old,new,1)

          old="result=detect_setup(shot,screen_origin=rect[:2],cancelled=self.stop.is_set)"
          new="result=detect_setup(shot,screen_origin=rect[:2],cancelled=self.stop.is_set,canvas_box_override=manual_canvas)"
          if old not in text:raise SystemExit('Paint detect_setup call anchor not found')
          text=text.replace(old,new,1)

          old="""                result=save_setup(result,meta,palette_path)\n                result['exact_colors_ready']=True\n"""
          new="""                result=save_setup(result,meta,palette_path)\n                result['manual_canvas_reused']=manual_canvas is not None\n                result['exact_colors_ready']=True\n"""
          if old not in text:raise SystemExit('Paint save_setup anchor not found')
          text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DrawBot.py
          git diff --cached --check
          git commit -m 'Honor selected Paint canvas during auto preparation'
          git push origin HEAD:main
