name: Step 29 Hybrid Renderer 3.0 integration once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step29-integration-once.yml'

permissions:
  contents: write

jobs:
  integrate-step29:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Step 29 integration
        run: python step29_integrate_once.py

      - name: Run Step 29 regressions
        shell: pwsh
        run: |
          python -m unittest -v test_hybrid_renderer3_v10128.py test_step25_quick_sketch_fill_contour_v10148.py test_pixel_accurate_v1086.py test_portrait_integration.py test_profile_isolation_v107.py test_profile_switch_safety.py test_target_capabilities_v10127.py test_profile_portability_step27.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile HybridRenderer3.py DrawBot.py StudioUI.py ProfileIsolation.py ProfilePortability.py PreviewDiagnostics.py build_exe.py Version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit integrated Step 29
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DrawBot.py StudioUI.py ProfileIsolation.py ProfilePortability.py PreviewDiagnostics.py build_exe.py Version.py version_info.txt ROADMAP-STEP22-PLUS.md README-INDEX.md
          git commit -m 'Complete Step 29 Hybrid Renderer 3.0'
          git push
