name: Package v1.0.126-beta Step 27.5 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step275-package-once.yml'

permissions:
  contents: write

jobs:
  package-step275:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Step 27.5 core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_one_click_setup_verification_v10126.py
          python -m py_compile OneClickSetupVerification.py DrawBot.py StudioUI.py ProfileIsolation.py ScreenTaskWindow.py build_exe.py Version.py

      - name: Build clean source ZIP
        run: python step275_package_once.py

      - name: Commit Step 27.5 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vxiey@users.noreply.github.com'
          git add Draw-Studio-1.0.126-beta-Step27.5-One-Click-Setup-Verification.zip SOURCE-PACKAGE-SHA256.txt README.md docs/VERSION-HISTORY.md VERSION-HISTORY.md
          git commit -m 'Add v1.0.126-beta Step 27.5 source package'
          git push
