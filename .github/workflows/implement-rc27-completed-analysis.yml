name: Integrate Image Draw Bot rc27 completed analysis

on:
  push:
    branches: [feature/completed-drawing-analysis-gartic-opacity]
    paths:
      - '.github/rc27-completed-analysis-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/completed-drawing-analysis-gartic-opacity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc27 integration
        run: python .github/scripts/implement_rc27.py
      - name: Compile changed runtime modules
        run: python -m py_compile CompletedDrawingAnalysis.py GarticOpacity.py BrowserBrushSize.py AutoBrushWidth.py ProfileIsolation.py StudioUI.py DrawBot.py
      - name: Run focused rc27 regressions
        run: python -m unittest -v test_rc27_completed_drawing_intelligence.py test_browser_brush_size_v1074.py test_auto_brush_total_time_v10144.py test_profile_isolation_v107.py
      - name: Run drawing motor and ETA regressions
        run: python -m unittest -v test_auto_brush_selector.py test_draw_motor_v1090.py test_bottleneck_fixes_v10146.py test_step13_safe_canvas_snapshot_scoring_v10137.py
      - name: Commit integrated rc27
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AutoBrushWidth.py ProfileIsolation.py StudioUI.py DrawBot.py build_exe.py Version.py installer/ImageDrawBot.iss VERSION-HISTORY.md docs/VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc27.md test_*.py
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate completed drawing intelligence and Gartic opacity rc27'
            git push origin HEAD:feature/completed-drawing-analysis-gartic-opacity
          fi
