name: Prepare v1.0.143-rc1 metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-v10143.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize release metadata except Version.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD_APP='1.0.142-rc1'
          NEW_APP='1.0.143-rc1'
          OLD_FILE='1.0.142'
          NEW_FILE='1.0.143'

          changed=[]
          def write(path, text):
              path=Path(path)
              old=path.read_text(encoding='utf-8') if path.exists() else None
              if old != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          # Only update current-version assertions in tests. Synthetic updater
          # fixtures intentionally using older/newer versions must remain intact.
          for path in Path('.').rglob('test_*.py'):
              text=path.read_text(encoding='utf-8')
              lines=[]
              for line in text.splitlines(keepends=True):
                  if 'APP_VERSION' in line and OLD_APP in line:
                      line=line.replace(OLD_APP, NEW_APP)
                  if 'FILE_VERSION' in line and OLD_FILE in line:
                      line=line.replace(OLD_FILE, NEW_FILE)
                  lines.append(line)
              write(path, ''.join(lines))

          path=Path('version_info.txt')
          text=path.read_text(encoding='utf-8')
          text=text.replace('filevers=(1,0,142,0)', 'filevers=(1,0,143,0)')
          text=text.replace('prodvers=(1,0,142,0)', 'prodvers=(1,0,143,0)')
          text=text.replace("StringStruct('FileVersion', '1.0.142')", "StringStruct('FileVersion', '1.0.143')")
          text=text.replace("StringStruct('ProductVersion', '1.0.142')", "StringStruct('ProductVersion', '1.0.143')")
          write(path,text)

          path=Path('installer/DrawStudio.iss')
          text=path.read_text(encoding='utf-8')
          text=text.replace('#define MyAppVersion "1.0.142-rc1"', '#define MyAppVersion "1.0.143-rc1"')
          text=text.replace('VersionInfoVersion=1.0.142.0', 'VersionInfoVersion=1.0.143.0')
          write(path,text)

          for name in ('README.md','README-INDEX.md','docs/IN-APP-UPDATES.md'):
              path=Path(name)
              if path.exists():
                  write(path,path.read_text(encoding='utf-8').replace(OLD_APP,NEW_APP))

          section='''# v1.0.143-rc1\n\n- Fix Microsoft Paint auto calibration when the blank document canvas extends beyond the visible window.\n- Accept a large verified blank visible canvas viewport instead of requiring every document edge to be on-screen.\n- Keep strict rejection for genuinely small, covered or ambiguous drawing areas.\n- Inset clipped client edges more aggressively so automatic drawing stays away from window boundaries and scroll/clipping edges.\n- Preserve full-canvas behavior and existing palette/tool verification when all Paint canvas borders are visible.\n- Add regression coverage for left/right/bottom clipped Paint documents and keep Windows/Linux CI plus DrawBot self-test as release gates.\n\n'''
          for name in ('VERSION-HISTORY.md','docs/VERSION-HISTORY.md'):
              path=Path(name)
              if path.exists():
                  old=path.read_text(encoding='utf-8')
                  if not old.startswith('# v1.0.143-rc1'):
                      write(path,section+old)

          notes='''# Draw Studio 1.0.143-rc1\n\n## Microsoft Paint — clipped canvas calibration\n\n- Fixes the `Paint canvas is clipped or too small` failure when modern Paint shows a valid blank canvas that extends beyond the client viewport.\n- Auto calibration now treats a large, blank, visually verified visible canvas rectangle as a safe drawing viewport even when the document is clipped at the left, right or bottom window edge.\n- Clipped edges receive a larger safety inset before coordinates are saved.\n- Visible canvas borders are still verified against the non-white Paint workspace, preventing covered or ambiguous regions from being accepted.\n- Truly small drawing regions still fail with a manual-selection fallback instead of unsafe guessing.\n- Existing Paint palette, Pencil, Fill, Eraser and custom RGB calibration remain unchanged.\n\n## Regression coverage\n\n- Fully visible canvas behavior remains locked.\n- Left/right/bottom clipped canvas viewport detection is covered.\n- Covered canvas rejection remains covered.\n- Full Windows/Linux CI and DrawBot Windows self-test are required before publication.\n'''
          write(Path('RELEASE-NOTES-v1.0.143-rc1.md'),notes)

          print(f'Changed {len(changed)} files')
          for item in changed: print(item)
          if len(changed) < 10:
              raise SystemExit('Version sync changed too few files; refusing to commit')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':!.github/workflows/sync-v10143.yml'
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit'
            exit 1
          fi
          git commit -m 'Sync v1.0.143-rc1 release metadata'
          git push origin HEAD:main
