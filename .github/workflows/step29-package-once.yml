name: Package v1.0.128-beta Step 29 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step29-package-once.yml'

permissions:
  contents: write

jobs:
  package-step29:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Step 29 release core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_hybrid_renderer3_v10128.py test_step25_quick_sketch_fill_contour_v10148.py test_pixel_accurate_v1086.py
          python -m py_compile HybridRenderer3.py DrawBot.py StudioUI.py ProfileIsolation.py ProfilePortability.py PreviewDiagnostics.py build_exe.py Version.py

      - name: Build clean source ZIP
        run: python step29_package_once.py

      - name: Commit Step 29 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Draw-Studio-1.0.128-beta-Step29-Hybrid-Renderer-3.zip SOURCE-PACKAGE-SHA256.txt README.md VERSION-HISTORY.md docs/VERSION-HISTORY.md
          git commit -m 'Add v1.0.128-beta Step 29 source package'
          git push
