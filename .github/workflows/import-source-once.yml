name: Clean Draw Studio source import branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-source-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary source-upload branch
        shell: bash
        run: |
          git push origin --delete source-upload-temp || true
