name: Patch Paint color bypass on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-paint-color-bypass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Paint sketch/single-color bypass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Split tool-only preparation from RGB-dialog calibration.
          path=Path('PaintPreparation.py')
          text=path.read_text(encoding='utf-8')
          old='''def prepare_controls(handle, *, cancelled=lambda:False, backend=automation):\n    """Select Pencil/1 px, capture RGB controls, then prove Edit colors is closed."""\n    def scan():return backend(handle,cancelled=cancelled)\n    def invoke(node):return backend(handle,element=node,action='invoke',cancelled=cancelled)\n    nodes=scan()\n    # An already-open color dialog is dismissed without accepting changes. Do not\n    # continue until the modal is actually gone from the Paint UI tree.\n    if edit_colors_dialog_open(nodes):\n        close_edit_colors(handle,cancelled=cancelled,backend=backend)\n        nodes=scan()\n    pencil=find_control(nodes,('pencil','penna','blyertspenna'),kind='Button')\n    invoke(pencil)\n    nodes=scan()\n    size=find_control(nodes,('size','brush size','pencil size','storlek','penselstorlek','pennstorlek','thickness','tjocklek'),kind='Slider')\n    backend(handle,element=size,action='size',cancelled=cancelled)\n    nodes=scan()\n    opener=find_custom_color_opener(nodes)\n    invoke(opener)\n    # Poll the UI tree, not a fixed dialog coordinate or a canvas test stroke.\n    deadline=time.monotonic()+5\n    while True:\n        nodes=scan()\n        try:\n            controls=rgb_controls(nodes)\n            break\n        except ValueError:\n            if time.monotonic()>deadline:raise ValueError('Paint Edit colors opened, but numeric RGB controls could not be calibrated. Keep the dialog in RGB mode and retry.')\n    # Critical invariant: automatic preparation must return with the modal gone.\n    # Canvas detection/verification is never allowed to inspect Paint while the\n    # calibration dialog itself is covering the document.\n    close_edit_colors(handle,cancelled=cancelled,backend=backend)\n    controls['OpenCustomColor']=center(opener)\n    return controls\n'''
          new='''def prepare_tool_controls(handle, *, cancelled=lambda:False, backend=automation):\n    """Prepare Pencil/1 px without ever opening Paint Edit colors.\n\n    This is the required path for black contour sketch, Single-color sketch\n    (current ink), and Eraser workflows.  It may close an already-open stale\n    Edit colors modal, but it never activates the custom-color opener.\n    """\n    def scan():return backend(handle,cancelled=cancelled)\n    def invoke(node):return backend(handle,element=node,action='invoke',cancelled=cancelled)\n    nodes=scan()\n    if edit_colors_dialog_open(nodes):\n        close_edit_colors(handle,cancelled=cancelled,backend=backend)\n        nodes=scan()\n    pencil=find_control(nodes,('pencil','penna','blyertspenna'),kind='Button')\n    invoke(pencil)\n    nodes=scan()\n    size=find_control(nodes,('size','brush size','pencil size','storlek','penselstorlek','pennstorlek','thickness','tjocklek'),kind='Slider')\n    backend(handle,element=size,action='size',cancelled=cancelled)\n    return True\n\n\ndef calibrate_rgb_controls(handle, *, cancelled=lambda:False, backend=automation):\n    """Open Edit colors only to learn numeric RGB controls, then close it."""\n    def scan():return backend(handle,cancelled=cancelled)\n    def invoke(node):return backend(handle,element=node,action='invoke',cancelled=cancelled)\n    nodes=scan()\n    opener=find_custom_color_opener(nodes)\n    invoke(opener)\n    deadline=time.monotonic()+5\n    while True:\n        nodes=scan()\n        try:\n            controls=rgb_controls(nodes)\n            break\n        except ValueError:\n            if time.monotonic()>deadline:raise ValueError('Paint Edit colors opened, but numeric RGB controls could not be calibrated. Keep the dialog in RGB mode and retry.')\n    close_edit_colors(handle,cancelled=cancelled,backend=backend)\n    controls['OpenCustomColor']=center(opener)\n    return controls\n\n\ndef prepare_controls(handle, *, cancelled=lambda:False, backend=automation):\n    """Backward-compatible full Paint tool + exact-RGB preparation."""\n    prepare_tool_controls(handle,cancelled=cancelled,backend=backend)\n    return calibrate_rgb_controls(handle,cancelled=cancelled,backend=backend)\n'''
          if old not in text: raise SystemExit('PaintPreparation prepare_controls anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          # 2) Auto Paint preparation: snapshot render policy on UI thread and
          # never open Edit colors for sketch/current-ink/eraser. Reuse an
          # existing numeric calibration for normal color modes.
          path=Path('DrawBot.py')
          text=path.read_text(encoding='utf-8')
          old='''        palette_path=Path(self.calibration_path)\n        request={'image':self.original} if start_after else None\n        self.paint_start_request=request\n        # Snapshot an explicit user-selected canvas on the UI thread. Paint's\n'''
          new='''        palette_path=Path(self.calibration_path)\n        request={'image':self.original} if start_after else None\n        self.paint_start_request=request\n        # Snapshot the render policy on the UI thread. Tk variables must not be\n        # read from the worker. Black contour sketch, Single-color sketch/current\n        # ink and Eraser do not need exact RGB and must never open Edit colors.\n        try:\n            _black_contour_sketch=bool(self.outline.get())\n        except Exception:\n            _black_contour_sketch=False\n        _skip_exact_rgb=bool(bypasses_palette(self) or _black_contour_sketch)\n        # Snapshot an explicit user-selected canvas on the UI thread. Paint's\n'''
          if old not in text: raise SystemExit('DrawBot policy anchor not found')
          text=text.replace(old,new,1)
          old='''                from PaintPreparation import ensure_paint,prepare_controls\n                candidate=ensure_paint(_enumerate_windows,cancelled=self.stop.is_set,wait=self.stop.wait)\n                target=(int(candidate['handle']),tuple(candidate['rect']))\n                if not WindowMonitor().activate(target):\n                    raise ValueError('Could not activate Paint. Bring it into view and retry.')\n                if self.stop.wait(.35):raise InterruptedError()\n                meta=probe_handle_isolated(int(candidate['handle']))\n                exact_controls=prepare_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                # Edit colors is a modal Paint window. prepare_controls() now\n                # proves that it has disappeared, but explicitly return focus to\n                # the Paint document before taking any canvas/ribbon screenshot.\n                # This prevents our own RGB calibration dialog from being treated\n                # as an overlay covering the selected drawing area.\n                if not WindowMonitor().activate(target):\n                    raise ValueError('Paint Edit colors closed, but Paint could not be reactivated. Bring Paint into view and retry.')\n                if self.stop.wait(.15):raise InterruptedError()\n                meta=probe_handle_isolated(int(candidate['handle']))\n                rect=tuple(meta['client_rect'])\n'''
          new='''                from PaintPreparation import ensure_paint,prepare_tool_controls,calibrate_rgb_controls\n                candidate=ensure_paint(_enumerate_windows,cancelled=self.stop.is_set,wait=self.stop.wait)\n                target=(int(candidate['handle']),tuple(candidate['rect']))\n                monitor=WindowMonitor()\n                if not monitor.activate(target):\n                    raise ValueError('Could not activate Paint. Bring it into view and retry.')\n                if self.stop.wait(.35):raise InterruptedError()\n                meta=probe_handle_isolated(int(candidate['handle']))\n                prepare_tool_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                exact_controls=None\n                exact_reused=False\n                if not _skip_exact_rgb:\n                    # Do not reopen Edit colors on every Paint start. A valid\n                    # profile-scoped numeric calibration is resolved against the\n                    # current client geometry and reused. Only first-time/stale\n                    # setups need to open the dialog.\n                    try:\n                        from ExactColorTools import numeric_rgb_available,resolved_controls\n                        if numeric_rgb_available('microsoft-paint'):\n                            exact_controls=resolved_controls('microsoft-paint',tuple(meta['client_rect']))\n                            required=('OpenCustomColor','ConfirmColor','RedField','GreenField','BlueField')\n                            if not all(name in exact_controls for name in required):\n                                exact_controls=None\n                            else:\n                                exact_reused=True\n                    except (OSError,ValueError,TypeError):\n                        exact_controls=None\n                    if exact_controls is None:\n                        exact_controls=calibrate_rgb_controls(int(candidate['handle']),cancelled=self.stop.is_set)\n                        if not monitor.activate(target):\n                            raise ValueError('Paint Edit colors closed, but Paint could not be reactivated. Bring Paint into view and retry.')\n                        if self.stop.wait(.15):raise InterruptedError()\n                        meta=probe_handle_isolated(int(candidate['handle']))\n                rect=tuple(meta['client_rect'])\n'''
          if old not in text: raise SystemExit('DrawBot preparation block anchor not found')
          text=text.replace(old,new,1)
          old='''                from ExactColorTools import save as save_exact_colors\n                from CalibrationAnchors import make_anchor\n                save_exact_colors('microsoft-paint',exact_controls,anchor=make_anchor(rect))\n                shot=ImageGrab.grab(bbox=rect,all_screens=True)\n'''
          new='''                if exact_controls is not None and not exact_reused:\n                    from ExactColorTools import save as save_exact_colors\n                    from CalibrationAnchors import make_anchor\n                    save_exact_colors('microsoft-paint',exact_controls,anchor=make_anchor(rect))\n                shot=ImageGrab.grab(bbox=rect,all_screens=True)\n'''
          if old not in text: raise SystemExit('DrawBot exact save anchor not found')
          text=text.replace(old,new,1)
          old="""                result['manual_canvas_reused']=manual_canvas is not None\n                result['exact_colors_ready']=True\n                result['start_request']=request\n"""
          new="""                result['manual_canvas_reused']=manual_canvas is not None\n                result['exact_colors_ready']=bool(_skip_exact_rgb or exact_controls is not None)\n                result['exact_colors_bypassed']=bool(_skip_exact_rgb)\n                result['exact_colors_reused']=bool(exact_reused)\n                result['start_request']=request\n"""
          if old not in text: raise SystemExit('DrawBot result anchor not found')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          # 3) Picture custom palette is meaningless in monochrome/current-ink
          # modes and must refuse before resolving/activating Paint.
          path=Path('PictureCustomPalette.py')
          text=path.read_text(encoding='utf-8')
          old='''    source = getattr(app, "original", None)\n    if source is None:\n        app.status.set("Load an image first, then build Custom color palette for picture.")\n        return False\n\n    source_id = id(source)\n'''
          new='''    source = getattr(app, "original", None)\n    if source is None:\n        app.status.set("Load an image first, then build Custom color palette for picture.")\n        return False\n    try:\n        single_color=bool(getattr(app,"paint_simple",None) and app.paint_simple.get())\n    except Exception:\n        single_color=False\n    try:\n        black_sketch=bool(getattr(app,"outline",None) and app.outline.get())\n    except Exception:\n        black_sketch=False\n    try:\n        eraser=bool(getattr(app,"paint_tool",None) and app.paint_tool.get()=="Eraser")\n    except Exception:\n        eraser=False\n    if single_color or black_sketch or eraser:\n        mode=("Single-color sketch/current ink" if single_color else ("Black contour sketch" if black_sketch else "Eraser"))\n        app.status.set(f"{mode} does not need custom RGB colors. Edit colors will not be opened.")\n        return False\n\n    source_id = id(source)\n'''
          if old not in text: raise SystemExit('PictureCustomPalette guard anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          # 4) Regression tests.
          path=Path('test_paint_preparation.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('''                              find_control, find_custom_color_opener, close_edit_colors,\n                              edit_colors_dialog_open)''','''                              find_control, find_custom_color_opener, close_edit_colors,\n                              edit_colors_dialog_open, prepare_tool_controls)''',1)
          anchor='''    def test_prepare_captures_controls_then_cancels_dialog(self):\n'''
          addition='''    def test_tool_only_preparation_never_opens_edit_colors(self):\n        main=[node('Pencil'),node('Size','Slider',(40,40,60,200)),node('Edit colors',rect=(80,10,120,40))]\n        actions=[]\n        def backend(handle,**kw):\n            if kw.get('action'):\n                actions.append((kw['action'],kw['element']['name']))\n            return main\n        self.assertTrue(prepare_tool_controls(42,backend=backend))\n        self.assertIn(('invoke','Pencil'),actions)\n        self.assertIn(('size','Size'),actions)\n        self.assertFalse(any(name=='Edit colors' for _action,name in actions))\n\n'''
          if anchor not in text: raise SystemExit('test_paint_preparation insertion anchor not found')
          text=text.replace(anchor,addition+anchor,1)
          path.write_text(text,encoding='utf-8')

          path=Path('test_picture_custom_palette_v10142.py')
          text=path.read_text(encoding='utf-8')
          anchor='''    def test_studio_ui_exposes_picture_palette_only_in_paint_scope(self):\n'''
          addition='''    def test_picture_palette_skips_edit_colors_for_single_color_or_black_sketch(self):\n        for single,outline,needle in ((True,False,'Single-color'),(False,True,'Black contour')):\n            app=SimpleNamespace(activity=None,closing=False,game=Var('Microsoft Paint'),original=picture(),\n                                paint_simple=Var(single),outline=Var(outline),paint_tool=Var('Pencil'),status=Status())\n            app.begin_worker=lambda *_a,**_k:self.fail('worker must not start')\n            self.assertFalse(pcp.start_picture_custom_palette(app))\n            self.assertIn(needle,app.status.value)\n            self.assertIn('will not be opened',app.status.value)\n\n'''
          if anchor not in text: raise SystemExit('picture palette test insertion anchor not found')
          text=text.replace(anchor,addition+anchor,1)
          path.write_text(text,encoding='utf-8')
          PY

          python -m py_compile PaintPreparation.py PictureCustomPalette.py DrawBot.py test_paint_preparation.py test_picture_custom_palette_v10142.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PaintPreparation.py DrawBot.py PictureCustomPalette.py test_paint_preparation.py test_picture_custom_palette_v10142.py
          git commit -m 'Bypass Paint Edit colors for sketch and single-color modes'
          git push origin HEAD:main
