name: Extra Fast 10-pack validation

on:
  push:
    branches:
      - improve/extra-fast-10-pack
    paths:
      - '.github/extra-fast-10-pack.trigger'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/extra-fast-10-pack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Extra Fast 10-pack
        run: python .github/scripts/implement_extra_fast_10.py

      - name: Compile touched planner
        run: python -m py_compile AdaptiveRegionHybrid.py test_extra_fast_10_improvements_rc25.py

      - name: Run focused Extra Fast regressions
        run: >-
          python -m unittest -v
          test_extra_fast_10_improvements_rc25.py
          test_extra_fast_budget_accounting_rc25.py
          test_extra_fast_region_quality_rc24.py
          test_rc23_region_brush_roi.py
          test_rc6_region_brush_packing.py
          test_axis_region_hybrid_v10145.py
          test_step7_extra_fast2_v10131.py
          test_extra_fast_v105.py
          test_rc17_unified_execution_cost_eta.py
          test_region_fill_v10117.py
          test_bottleneck_fixes_v10146.py

      - name: Run complete Windows regressions
        run: python -m unittest discover -v

      - name: Run Image Draw Bot self-test
        run: python DrawBot.py --self-test

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AdaptiveRegionHybrid.py test_extra_fast_10_improvements_rc25.py
          git diff --cached --check
          git commit -m 'Improve Extra Fast with 10 execution optimizations'
          git push origin HEAD:improve/extra-fast-10-pack
