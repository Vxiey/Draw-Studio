name: Draw Studio v1.0.130-rc2 integration once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step30-integration-once.yml'

permissions:
  contents: write

jobs:
  integrate-rc2:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply RC2 hardening
        shell: pwsh
        run: |
          python rc2_integrate_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rc2_testfix_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run RC2 focused regressions
        shell: pwsh
        run: |
          python -m unittest -v test_step30_release_candidate_hardening_v10129rc1.py test_release_v100.py test_update_center_v1059.py test_hybrid_renderer3_v10128.py test_profile_portability_step27.py test_stability_release_candidate_v1081.py test_step18_release_stability_hardening_v10142.py test_step21_release_cleanup_v10144.py test_version_metadata.py test_version_history_v1068.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regression discovery
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run self-test and compile checks
        shell: pwsh
        run: |
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile ReleaseCandidateHardening.py ReleasePackage.py StabilityRC.py ReleaseStabilityHardening.py SkribblFastRenderer.py UpdateCenter.py build_release.py PreviewDiagnostics.py DrawBot.py HybridRenderer3.py Version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit RC2 source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/*' ':!.github/step30-build-trigger'
          if git diff --cached --quiet; then
            echo 'No RC2 source changes to commit'
            exit 0
          fi
          git commit -m 'Prepare v1.0.130-rc2 release hardening'
          git push
