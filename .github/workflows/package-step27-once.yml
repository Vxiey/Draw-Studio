name: Package v1.0.125-beta Step 27 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-step27-once.yml'

permissions:
  contents: write

jobs:
  package-step27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Step 27 core
        run: |
          python -m unittest -v test_profile_portability_step27.py
          python -m py_compile ProfilePortability.py StudioUI.py DrawBot.py GameProfiles.py ProfileStorage.py ProfileIsolation.py

      - name: Build clean source ZIP
        run: python step27_package_once.py

      - name: Commit Step 27 package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Draw-Studio-1.0.125-beta-Step27-Profile-Portability.zip SOURCE-PACKAGE-SHA256.txt README.md docs/VERSION-HISTORY.md
          git commit -m 'Add v1.0.125-beta Step 27 source package'
          git push
