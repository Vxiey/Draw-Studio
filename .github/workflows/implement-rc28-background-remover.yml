name: Integrate Image Draw Bot rc28 background remover

on:
  push:
    branches: [feature/background-remover-png-rc28]
    paths:
      - '.github/rc28-background-remover-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/background-remover-png-rc28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc28 integration
        run: python .github/scripts/implement_rc28_background_remover.py
      - name: Compile changed modules
        run: python -m py_compile BackgroundRemoval.py DrawBot.py StudioUI.py Version.py
      - name: Run rc28 regressions
        run: python -m unittest -v test_rc28_background_removal.py test_rc27_completed_drawing_intelligence.py test_browser_brush_size_v1074.py test_auto_brush_total_time_v10144.py test_profile_isolation_v107.py
      - name: Run planner regressions
        run: python -m unittest -v test_draw_motor_v1090.py test_bottleneck_fixes_v10146.py test_step13_safe_canvas_snapshot_scoring_v10137.py
      - name: Commit integrated rc28
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DrawBot.py StudioUI.py build_exe.py Version.py installer/ImageDrawBot.iss VERSION-HISTORY.md docs/VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc28.md test_*.py
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate background remover and PNG workflow rc28'
            git push origin HEAD:feature/background-remover-png-rc28
          fi
