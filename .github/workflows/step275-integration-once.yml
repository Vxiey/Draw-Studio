name: Step 27.5 one-click setup verification once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step275-integration-once.yml'

permissions:
  contents: read

jobs:
  verify-step275:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Step 27.5 and setup safety regressions
        shell: pwsh
        run: |
          python -m unittest -v test_one_click_setup_verification_v10126.py test_browser_visual_preflight_v1072.py test_browser_one_click_v1080.py test_paint_full_v106.py test_profile_isolation_v107.py test_profile_switch_safety.py test_step9_profile_calibration_isolation_v10133.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile OneClickSetupVerification.py DrawBot.py StudioUI.py ProfileIsolation.py ScreenTaskWindow.py build_exe.py Version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
