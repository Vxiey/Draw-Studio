name: Step 27.5 one-click setup integration once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/step275-integration-once.yml'

permissions:
  contents: write

jobs:
  integrate-step275:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Step 27.5 integration
        run: python step275_integrate_once_v2.py

      - name: Run Step 27.5 and setup safety regressions
        run: |
          python -m unittest -v test_one_click_setup_verification_v10126.py test_browser_visual_preflight_v1072.py test_browser_one_click_v1080.py test_paint_full_v106.py test_profile_isolation_v107.py test_profile_switch_safety.py test_step9_profile_calibration_isolation_v10133.py
          python -m py_compile OneClickSetupVerification.py DrawBot.py StudioUI.py ProfileIsolation.py ScreenTaskWindow.py build_exe.py Version.py

      - name: Commit integrated Step 27.5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vxiey@users.noreply.github.com'
          git add OneClickSetupVerification.py test_one_click_setup_verification_v10126.py DrawBot.py StudioUI.py ProfileIsolation.py ScreenTaskWindow.py build_exe.py Version.py ROADMAP-STEP22-PLUS.md
          git commit -m 'Complete Step 27.5 one-click setup verification'
          git push
