name: Prepare Image Draw Bot rc11 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-rc11.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize rc11 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = '1.0.144-rc10'
          new = '1.0.144-rc11'
          excluded = {
              'RELEASE-NOTES-v1.0.144-rc10.md',
              'VERSION-HISTORY.md',
              'docs/VERSION-HISTORY.md',
              '.github/workflows/prepare-rc11.yml',
          }

          matches = subprocess.check_output(['git', 'grep', '-Il', old], text=True).splitlines()
          for name in matches:
              if name in excluded:
                  continue
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')

          lines = [
              '# Image Draw Bot v1.0.144-rc11 — Shutdown stability fix',
              '',
              '- Fix a Windows shutdown crash where CustomTkinter/Tk could receive a second destroy call after the Tcl application had already been destroyed.',
              '- Make branded root destruction idempotent so converging close/startup-error/teardown paths safely become a no-op after the first shutdown.',
              '- Ignore only the specific TclError that means the application is already destroyed; unrelated Tcl errors still surface normally.',
              '- Install the shutdown guard before optional icon/branding setup so teardown remains protected even if decorative branding cannot load.',
              '- Add regression coverage for the exact "can\'t invoke destroy command: application has been destroyed" failure and repeated root.destroy() calls.',
              '- Keep the compact UI and all rc10 drawing/rendering behavior unchanged.',
              '',
              'The release remains protected by source-package checks, the complete Windows regression suite, ImageDrawBot self-test, packaged-release validation and silent installer install/uninstall verification before publication.',
              '',
          ]
          notes = '\n'.join(lines)
          Path(f'RELEASE-NOTES-v{new}.md').write_text(notes, encoding='utf-8')

          for name in ('VERSION-HISTORY.md', 'docs/VERSION-HISTORY.md'):
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              if f'# Image Draw Bot v{new}' not in text:
                  path.write_text(notes.rstrip() + '\n\n' + text.lstrip(), encoding='utf-8')

          Path('.github/release-build-trigger').write_text(new + ' shutdown-stability\n', encoding='utf-8')

          helper = Path('.github/workflows/prepare-rc11.yml')
          if helper.exists():
              helper.unlink()
          PY

      - name: Verify release metadata before commit
        shell: bash
        run: |
          python - <<'PY'
          from Version import APP_VERSION, FILE_VERSION, BUILD_CHANNEL
          assert APP_VERSION == '1.0.144-rc11', APP_VERSION
          assert FILE_VERSION == '1.0.144', FILE_VERSION
          assert BUILD_CHANNEL == 'rc', BUILD_CHANNEL
          PY
          test -f RELEASE-NOTES-v1.0.144-rc11.md
          grep -q '#define MyAppVersion "1.0.144-rc11"' installer/ImageDrawBot.iss
          if git grep -n '1.0.144-rc10' -- 'test_*.py'; then
            echo 'A current-version regression assertion still references rc10.' >&2
            exit 1
          fi

      - name: Commit synchronized rc11 release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 1.0.144-rc11 shutdown stability fix'
          git push origin HEAD:main
