name: SEO social preview once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-preview-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate social preview
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W, H = 1280, 640
          img = Image.new('RGB', (W, H), (17, 24, 39))
          px = img.load()
          for y in range(H):
              for x in range(W):
                  t = x / (W - 1)
                  u = y / (H - 1)
                  px[x, y] = (
                      int(17 + 14*t + 4*u),
                      int(24 + 16*t + 6*u),
                      int(39 + 34*t + 8*u),
                  )

          d = ImageDraw.Draw(img)
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          f_title = ImageFont.truetype(bold, 92)
          f_sub = ImageFont.truetype(bold, 42)
          f_line = ImageFont.truetype(regular, 30)
          f_small = ImageFont.truetype(regular, 26)
          f_badge = ImageFont.truetype(bold, 18)

          x0 = 78
          d.rounded_rectangle((x0, 62, x0+236, 108), radius=18, fill=(37, 99, 235))
          d.text((x0+22, 73), 'AUTO DRAW • WINDOWS', font=f_badge, fill='white')
          d.text((x0, 145), 'Draw Studio', font=f_title, fill='white')
          d.text((x0, 260), 'Turn images into drawings.', font=f_sub, fill=(226, 232, 240))
          d.text((x0, 335), 'Gartic Phone  •  Skribbl.io  •  Microsoft Paint', font=f_line, fill=(191, 219, 254))
          d.text((x0, 388), 'Fast paths  •  Color matching  •  Pixel Accurate', font=f_small, fill=(203, 213, 225))
          d.text((x0, 525), 'github.com/Vxiey/Draw-Studio', font=f_small, fill=(148, 163, 184))

          card = (838, 126, 1194, 494)
          d.rounded_rectangle(card, radius=32, fill=(248, 250, 252), outline=(148, 163, 184), width=2)
          cx1, cy1, cx2, cy2 = card
          d.rounded_rectangle((cx1+22, cy1+22, cx2-22, cy1+64), radius=14, fill=(226, 232, 240))
          for i, color in enumerate([(239,68,68),(250,204,21),(34,197,94),(59,130,246),(168,85,247)]):
              x = cx1 + 40 + i*46
              d.ellipse((x, cy1+31, x+20, cy1+51), fill=color)
          canvas = (cx1+34, cy1+86, cx2-34, cy2-34)
          d.rounded_rectangle(canvas, radius=18, fill='white', outline=(203, 213, 225), width=2)
          pts = [(894,393),(925,338),(960,364),(992,288),(1030,332),(1063,251),(1098,303),(1144,222)]
          d.line(pts, fill=(37,99,235), width=14, joint='curve')
          for p in pts:
              d.ellipse((p[0]-7,p[1]-7,p[0]+7,p[1]+7), fill=(37,99,235))
          d.polygon([(1087,377),(1132,397),(1114,407),(1128,437),(1110,445),(1096,414),(1079,430)], fill=(15,23,42))

          out = Path('assets/social-preview.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          img.save(out, 'PNG', optimize=True)
          print(f'Created {out} ({out.stat().st_size} bytes)')
          PY

      - name: Try SEO repository description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}" \
            -f description='Auto-draw images in Gartic Phone, Skribbl.io and Microsoft Paint. A Windows drawing automation app with color matching, fast fills, previews and pixel-accurate rendering.'

      - name: Try SEO repository topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/topics" \
            -f 'names[]=gartic-phone' \
            -f 'names[]=garticphone' \
            -f 'names[]=gartic' \
            -f 'names[]=skribbl' \
            -f 'names[]=skribbl-io' \
            -f 'names[]=drawing-bot' \
            -f 'names[]=drawbot' \
            -f 'names[]=auto-draw' \
            -f 'names[]=drawing-automation' \
            -f 'names[]=image-to-drawing' \
            -f 'names[]=drawing' \
            -f 'names[]=automation' \
            -f 'names[]=desktop-automation' \
            -f 'names[]=image-processing' \
            -f 'names[]=microsoft-paint' \
            -f 'names[]=python' \
            -f 'names[]=windows' \
            -f 'names[]=windows-app' \
            -f 'names[]=desktop-app' \
            -f 'names[]=customtkinter'

      - name: Commit social preview
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social-preview.png
          if git diff --cached --quiet; then
            echo 'Social preview already up to date.'
            exit 0
          fi
          git commit -m 'Add SEO social preview image'
          git push origin HEAD:main
