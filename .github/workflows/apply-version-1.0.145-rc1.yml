name: Apply Image Draw Bot 1.0.145-rc1 version bump

on:
  push:
    paths:
      - '.github/version-1.0.145-rc1-trigger'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply version bump
        run: python .github/bump-to-1.0.145-rc1.py
      - name: Compile version-sensitive modules
        run: python -m py_compile Version.py DrawBot.py StudioUI.py UpdateCenter.py
      - name: Run focused version and updater regressions
        run: python -m pytest -q test_version_history_v1068.py test_image_draw_bot_identity_v10144.py test_mobile_preview_v1069.py test_update_center_v1059.py test_auto_brush_total_time_v10144.py
      - name: Commit verified version bump
        shell: bash
        run: |
          git config user.name "Vxiey"
          git config user.email "84341307+Vxiey@users.noreply.github.com"
          git add -A
          git reset -- .github/bump-to-1.0.145-rc1.py .github/workflows/apply-version-1.0.145-rc1.yml .github/version-1.0.145-rc1-trigger
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 1
          fi
          git commit -m "Image Draw Bot 1.0.145-rc1 verified drawing baseline"
          git push origin HEAD:main
