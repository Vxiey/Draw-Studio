name: Prepare Image Draw Bot rc12 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-rc12.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize rc12 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = '1.0.144-rc11'
          new = '1.0.144-rc12'
          excluded = {
              'RELEASE-NOTES-v1.0.144-rc11.md',
              'VERSION-HISTORY.md',
              'docs/VERSION-HISTORY.md',
              '.github/workflows/prepare-rc12.yml',
          }

          matches = subprocess.check_output(['git', 'grep', '-Il', old], text=True).splitlines()
          for name in matches:
              if name in excluded:
                  continue
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')

          lines = [
              '# Image Draw Bot v1.0.144-rc12 — Paint palette transaction stability',
              '',
              '- Harden Microsoft Paint picture-palette preparation with explicit OPEN → WRITE → VERIFY → COMMIT → VERIFY transaction states.',
              '- Retry transient Paint RGB-entry failures up to three bounded attempts with adaptive backoff instead of continuing with stale UI state.',
              '- Re-read calibrated Edit colors controls during recovery and after every committed custom color before moving to the next RGB value.',
              '- Never click + / Add to custom colors until the live R/G/B fields have been verified for the requested color.',
              '- On cancellation or final failure, safely escape the Paint modal and always release native input ownership.',
              '- Preserve the existing picture-palette planner, perceptual refinement, cache, CanvasGuard, render-resume and anchor-safety behavior.',
              '- Keep possible Fill leaks as a hard stop; regions rejected before Fill continue to use the existing safe stroke/scanline fallback.',
              '- Add focused regression coverage for retry bounds, transient recovery, exception preservation and no premature Add-to-custom-colors click.',
              '',
              'The release remains protected by source-package checks, portable raster/planner regressions, the complete Windows regression suite, ImageDrawBot self-test, packaged-release validation and silent installer install/uninstall verification before publication.',
              '',
          ]
          notes = '\n'.join(lines)
          Path(f'RELEASE-NOTES-v{new}.md').write_text(notes, encoding='utf-8')

          for name in ('VERSION-HISTORY.md', 'docs/VERSION-HISTORY.md'):
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              if f'# Image Draw Bot v{new}' not in text:
                  path.write_text(notes.rstrip() + '\n\n' + text.lstrip(), encoding='utf-8')

          Path('.github/release-build-trigger').write_text(new + ' paint-palette-transaction-stability\n', encoding='utf-8')

          helper = Path('.github/workflows/prepare-rc12.yml')
          if helper.exists():
              helper.unlink()
          PY

      - name: Verify release metadata before commit
        shell: bash
        run: |
          python - <<'PY'
          from Version import APP_VERSION, FILE_VERSION, BUILD_CHANNEL
          assert APP_VERSION == '1.0.144-rc12', APP_VERSION
          assert FILE_VERSION == '1.0.144', FILE_VERSION
          assert BUILD_CHANNEL == 'rc', BUILD_CHANNEL
          PY
          test -f RELEASE-NOTES-v1.0.144-rc12.md
          grep -q '#define MyAppVersion "1.0.144-rc12"' installer/ImageDrawBot.iss
          if git grep -n '1.0.144-rc11' -- 'test_*.py'; then
            echo 'A current-version regression assertion still references rc11.' >&2
            exit 1
          fi

      - name: Commit synchronized rc12 release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 1.0.144-rc12 Paint palette stability'
          git push origin HEAD:main
