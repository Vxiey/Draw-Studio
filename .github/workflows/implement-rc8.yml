name: Implement Image Draw Bot rc8

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc8-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc8 Dynamic Replanner patch
        run: python .github/rc8_patch.py
      - name: Run rc8 focused regressions
        run: |
          python -m unittest -v test_rc8_dynamic_replanner.py
          python -m unittest -v test_deadline_runtime_optimizer_v10119.py test_step8_deadline_scheduler_panic_v10132.py test_adaptive_deadline_v10118.py
          python -m py_compile DeadlineScheduler.py DrawBot.py Version.py
      - name: Commit rc8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/rc8_patch.py .github/implement-rc8-trigger .github/workflows/implement-rc8.yml
          git add DeadlineScheduler.py DrawBot.py Version.py installer/ImageDrawBot.iss README.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc8.md test_*.py
          git commit -m "Implement rc8 Dynamic Replanner"
          git push origin main
