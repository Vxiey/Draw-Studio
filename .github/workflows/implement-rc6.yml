name: Implement Image Draw Bot rc6

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc6-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc6 region brush packing patch
        run: python .github/rc6_patch.py
      - name: Run rc6 focused regressions
        run: |
          python -m unittest -v test_rc6_region_brush_packing.py
          python -m unittest -v test_auto_brush_selector.py test_draw_motor_v1090.py
          python -m py_compile AdaptiveRegionHybrid.py Version.py
      - name: Commit rc6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/rc6_patch.py .github/implement-rc6-trigger .github/workflows/implement-rc6.yml
          git add AdaptiveRegionHybrid.py Version.py test_*.py
          git commit -m "Implement rc6 exact region brush packing"
          git push origin main
