name: Draw Studio CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: draw-studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-core:
    name: core-${{ matrix.os }}-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate source package hygiene
        run: python ReleasePackage.py --check

      - name: Run exact raster and portable planner regressions
        run: >-
          python -m unittest -v
          test_raster_identity.py
          test_raster_identity_property.py
          test_extra_fast_review.py
          test_hybrid_cost_engine_v10131.py
          test_engine_finalization_v10132.py
          test_step17_golden_image_regression_v10141.py

      - name: Run Extra Fast benchmark smoke
        run: python benchmark_extra_fast.py

      - name: Run complete Windows regressions
        if: runner.os == 'Windows'
        run: python -m unittest discover -v

      - name: Run DrawBot Windows self-test
        if: runner.os == 'Windows'
        run: python DrawBot.py --self-test
