name: Update README app screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/update-readme-screenshot-trigger'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old_top = '![Image Draw Bot: automatic image drawing for Microsoft Paint, Gartic Phone and Skribbl.io](assets/image-draw-bot-social-preview.png)'
          new_top = '![Image Draw Bot application screenshot](assets/image-draw-bot-app-screenshot.webp)'
          if old_top not in text:
              raise SystemExit('README top banner marker not found')
          text = text.replace(old_top, new_top, 1)

          banner = '![Image Draw Bot promotional banner](assets/image-draw-bot-social-preview.png)'
          if banner not in text:
              marker = '- Manual preview, estimated draw time, stop/pause hotkeys and safety guards.\n\n'
              if marker not in text:
                  raise SystemExit('Core features insertion marker not found')
              text = text.replace(
                  marker,
                  marker + '### Image Draw Bot banner\n\n' + banner + '\n\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git commit -m 'Show app screenshot at top of README'
          git push origin HEAD:main
