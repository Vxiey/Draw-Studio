name: Prepare Image Draw Bot rc26

on:
  push:
    branches:
      - release/v1.0.145-rc26
    paths:
      - '.github/prepare-rc26-trigger'

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.145-rc26
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare atomic rc26 metadata
        run: python .github/scripts/prepare_rc26.py
      - name: Source package hygiene gate
        run: python ReleasePackage.py --check
      - name: Release source gate
        run: python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000
      - name: Complete Windows regressions
        run: python -m unittest discover -v
      - name: Image Draw Bot self-test
        run: python DrawBot.py --self-test
      - name: Commit verified rc26 metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add RELEASE-NOTES-v1.0.145-rc26.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Release Image Draw Bot v1.0.145-rc26"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:release/v1.0.145-rc26
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
