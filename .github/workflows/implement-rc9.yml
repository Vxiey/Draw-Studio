name: Implement Image Draw Bot rc9

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc9-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc9 Progressive Drawing patch
        run: python .github/rc9_patch.py
      - name: Run rc9 focused regressions
        run: |
          python -m unittest -v test_rc9_progressive_drawing.py
          python -m unittest -v test_progressive_renderer_v1021.py test_deadline_runtime_optimizer_v10119.py
          python -m py_compile ProgressiveRenderer.py Version.py
      - name: Commit rc9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/rc9_patch.py .github/implement-rc9-trigger .github/workflows/implement-rc9.yml
          git add ProgressiveRenderer.py Version.py installer/ImageDrawBot.iss README.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc9.md test_*.py
          git commit -m "Implement rc9 Progressive Drawing 2.0"
          git push origin main
