name: Implement Image Draw Bot rc24

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc24-trigger'

permissions:
  contents: write

concurrency:
  group: implement-image-draw-bot-rc24
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Synchronize rc24 release metadata
        run: python .github/scripts/implement_rc24.py

      - name: Validate rc24 source release gate
        run: python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000

      - name: Run rc24 axis and sketch regressions
        run: python -m pytest -q test_axis_region_hybrid_v10145.py test_gartic_sketch_v1098.py

      - name: Run complete regression suite
        run: python -m unittest discover -v

      - name: Commit rc24 release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Version.py installer/ImageDrawBot.iss README.md README-INDEX.md docs VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc24.md test_*.py
          git diff --cached --check
          git commit -m 'Release Image Draw Bot v1.0.145-rc24'
          git push origin HEAD:main
