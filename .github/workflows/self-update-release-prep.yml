name: Prepare v1.0.140-rc1 self-update release branch

on:
  push:
    branches:
      - v1.0.140-rc1-self-update

permissions:
  contents: write

concurrency:
  group: draw-studio-v10140-release-prep
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release migration
        run: python release_self_update_migrate.py
      - name: Validate prepared source
        run: |
          python -m py_compile Version.py UpdateCenter.py test_update_center_v1059.py test_installer_updates.py test_release_v100.py
          python -m unittest -v test_update_center_v1059.py test_installer_updates.py test_release_v100.py test_version_metadata.py test_version_history_v1068.py
          python ReleasePackage.py --check
      - name: Commit normal source changes
        shell: bash
        run: |
          rm release_self_update_migrate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No normal source changes to commit.'
            exit 0
          fi
          git commit -m "Release v1.0.140-rc1 with verified Windows self-update"
          git push origin HEAD:v1.0.140-rc1-self-update
