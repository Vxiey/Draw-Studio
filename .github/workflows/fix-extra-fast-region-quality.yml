name: Fix Extra Fast regional quality

on:
  push:
    branches:
      - fix/extra-fast-region-quality
    paths:
      - .github/extra-fast-region-quality.trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/extra-fast-region-quality
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply root-cause patch
        run: python .github/scripts/fix_extra_fast_region_quality.py

      - name: Compile touched planners
        run: python -m py_compile DrawBot.py AutoDrawing.py AdaptiveRegionHybrid.py test_extra_fast_region_quality_rc24.py

      - name: Run focused Extra Fast regressions
        run: python -m unittest -v test_extra_fast_region_quality_rc24 test_rc23_region_brush_roi test_rc6_region_brush_packing test_axis_region_hybrid_v10145 test_step7_extra_fast2_v10131

      - name: Run complete Windows regressions
        run: python -m unittest discover -v

      - name: Run Image Draw Bot self-test
        run: python DrawBot.py --self-test

      - name: Commit verified patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DrawBot.py AutoDrawing.py AdaptiveRegionHybrid.py test_extra_fast_region_quality_rc24.py
          if (git diff --cached --quiet) { Write-Host "No patch changes to commit"; exit 0 }
          git commit -m "Fix Extra Fast regional quality and brush planning"
          git push origin HEAD:fix/extra-fast-region-quality
