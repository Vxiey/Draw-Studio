name: Prepare Image Draw Bot automatic brush release

on:
  push:
    paths:
      - '.github/workflows/prepare-auto-brush-release.yml'
      - '.github/prepare-auto-brush-release.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare rc13 source
        run: python .github/prepare-auto-brush-release.py
      - name: Validate prepared source
        run: |
          git diff --check
          python -m unittest -v test_auto_brush_selector test_draw_motor_v1090 test_browser_brush_size_v1074 test_version_metadata test_release_v100
      - name: Commit prepared source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 1.0.144-rc13 automatic brush release'
          git push origin HEAD:main
